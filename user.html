<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA — Laman User</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind (optional; untuk gaya asas bersih) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide (untuk ikon sosial jika perlu) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Interact.js untuk drag/resize dalam mod editor (iframe dashboard) -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

  <style>
    :root{
      --brand:#ef4444;
      --contentW: 980px;
      --hSize: 28px; --hColor:#111111; --hWeight:800;
      --bSize: 16px; --bColor:#374151; --bWeight:400;
    }
    html,body{font-family:Inter,system-ui,ui-sans-serif; background:#fff; color:#111;}
    .wrap{max-width:var(--contentW); margin:32px auto; padding:0 16px;}
    .sec-title{font-size:var(--hSize); color:var(--hColor); font-weight:var(--hWeight);}
    .sec-body{font-size:var(--bSize); color:var(--bColor); font-weight:var(--bWeight); line-height:1.7;}
    .badge{display:inline-block;background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:9999px;font-size:12px;padding:2px 8px;}
    .btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--brand);color:#fff;padding:.6rem 1rem;border-radius:.7rem;text-decoration:none;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 6px 24px rgba(15,23,42,.06);}
    /* ===== Canvas Layer (for editor via dashboard) ===== */
    .canvas-host{position:relative; margin:24px auto; max-width:var(--contentW);}
    .canvas-stage{position:relative; width:100%; min-height:320px; border:1px dashed #e5e7eb; border-radius:12px; background:#fafafa;}
    .el{position:absolute; box-sizing:border-box; user-select:none;}
    .el.selected{outline:2px solid #111;}
    .el[data-type="text"]{display:flex;align-items:center;justify-content:center;padding:8px;}
    .el[data-type="button"] a{display:inline-block;padding:.55rem .9rem;border-radius:.7rem;color:#fff;text-decoration:none;}
    .el[data-type="image"] img{width:100%;height:100%;object-fit:cover;border-radius:8px;}
    .el[data-type="video"] iframe,.el[data-type="video"] video{width:100%;height:100%;border:0;border-radius:8px;}
    .el[data-type="shape"]{background:#ef4444;}
    .ghost-msg{display:none;position:absolute;top:8px;right:8px;background:#111;color:#fff;padding:6px 10px;border-radius:8px;font-size:12px;opacity:.9}
    .editor-active .ghost-msg{display:block;}
  </style>
</head>
<body>

<!-- ===== WRAPPER ===== -->
<div class="wrap">
  <!-- Header ringkas -->
  <header class="mb-6 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-[color:var(--brand)] text-white grid place-items-center shadow-sm">
        <i data-lucide="rocket" class="w-5 h-5"></i>
      </div>
      <div>
        <div class="text-lg font-semibold">MOVA</div>
        <div class="text-xs text-gray-500" id="helloUser">Selamat datang</div>
      </div>
    </div>
    <div class="text-xs text-gray-500" id="viewModeHint"></div>
  </header>

  <!-- Notice akses -->
  <div id="accessNotice" class="hidden card p-4 mb-6">
    <div class="text-sm text-gray-700" id="accessText"></div>
  </div>

  <!-- ===== Sections (content-driven) ===== -->
  <main id="sectionsHost" class="space-y-8"></main>

  <!-- ===== Canvas Design Layer (elements_json) ===== -->
  <section id="canvasHost" class="canvas-host mt-10">
    <div id="canvasStage" class="canvas-stage">
      <div class="ghost-msg rounded">Editor aktif (melalui Dashboard) — boleh drag/resize klik elemen.</div>
      <!-- Elemen akan dimasukkan secara dinamik -->
    </div>
  </section>

  <!-- Footer ringkas -->
  <footer class="mt-12 text-center text-xs text-gray-400">
    © <span id="yearNow"></span> MOVA. Semua hak cipta terpelihara.
  </footer>
</div>

<script>
/** =========================
 *  KONFIG / UTIL
 *  ========================= */
const EXEC_URL = "https://script.google.com/macros/s/AKfycbylAgFpv3cyZV7jPQFF8ROBB2nEIRTdF-Go6UtHQ4YN8KfAqGa914hTtiwmVeq0XtM/exec";

const qs = new URLSearchParams(location.search);
const editorFlagQS = qs.get('editor') === '1'; // optional trigger
const inIframe = (function(){ try { return window.self !== window.top; } catch(_){ return true; }})();
let EDITOR_MODE = editorFlagQS || inIframe; // bila dibuka dari dashboard (iframe), mod editor hidup

const state = {
  user: null,
  settings: {},
  elements: [], // dari elements_json
  // mapping element DOM
  elementMap: new Map()
};

const helloUser = document.getElementById('helloUser');
const accessNotice = document.getElementById('accessNotice');
const accessText = document.getElementById('accessText');
const sectionsHost = document.getElementById('sectionsHost');
const canvasStage = document.getElementById('canvasStage');
const viewModeHint = document.getElementById('viewModeHint');
document.getElementById('yearNow').textContent = new Date().getFullYear();
lucide.createIcons();

/** =========================
 *  BOOT
 *  ========================= */
(async function boot(){
  // 1) Sesi user (login) diperlukan
  state.user = loadUserSession();
  if (!state.user){ return deny("Sila log masuk terlebih dahulu.", true); }

  helloUser.textContent = `Hai, ${state.user.name||'user'}`;

  try{
    // 2) Sahkan akses (mesti approved)
    const ok = await resolveAccess(state.user);
    if (!ok){ return; }

    // 3) Muat tetapan & render
    await loadSettings();
    applyThemeFromSettings();
    renderSections();
    buildCanvasFromElements();

    // 4) Jika editor (dipanggil dari dashboard), aktifkan interaksi & messaging
    if (EDITOR_MODE) {
      document.body.classList.add('editor-active');
      enableInteract();
      setupPostMessage();
      viewModeHint.textContent = 'Mode: Preview Editor (via Dashboard)';
    } else {
      viewModeHint.textContent = 'Mode: Paparan';
    }
  }catch(e){
    deny('Ralat memuat data. Cuba lagi.', false);
  }
})();

/** =========================
 *  Sesi & Akses
 *  ========================= */
function loadUserSession(){
  try{
    // Jangkaan struktur: { user_id, name, phone, status, partner, token? }
    return JSON.parse(localStorage.getItem('mova_user') || 'null');
  }catch(_){ return null; }
}

async function resolveAccess(user){
  try{
    const res = await callApi('resolve_access', { phone: user.phone||'', name: user.name||'' });
    // Jangkaan: { success:true, approved:true/false, reason? }
    if (!res.success){ deny('Gagal menyemak akses.', false); return false; }
    if (!res.approved){ deny('Akses ditolak atau belum diluluskan. Hubungi Leader.', false); return false; }
    return true;
  }catch(_){
    deny('Ralat rangkaian semak akses.', false);
    return false;
  }
}

function deny(msg, redirect){
  accessText.textContent = msg;
  accessNotice.classList.remove('hidden');
  sectionsHost.innerHTML = '';
  if (redirect){
    setTimeout(()=> location.href = './index.html', 800);
  }
}

/** =========================
 *  API
 *  ========================= */
async function callApi(path, payload){
  const res = await fetch(EXEC_URL, {
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
    body: new URLSearchParams({ path, payload: JSON.stringify(payload||{}) })
  });
  const text = await res.text();
  let json; try{ json = JSON.parse(text); }catch(e){ throw new Error(text); }
  if (json && json.success === false) throw new Error(json.error || 'Unknown error');
  return json;
}

async function loadSettings(){
  const out = await callApi('settings_get', { leader_id: (state.user?.leader_id || state.user?.owner_id || 'LEADER') });
  state.settings = out.settings || {};
  // Parse sections
  let arr = []; try{ arr = JSON.parse(state.settings.sections_json || '[]'); }catch(_){}
  state.sections = Array.isArray(arr) ? arr : [];
  // Parse elements
  let els = []; try{ els = JSON.parse(state.settings.elements_json || '[]'); }catch(_){}
  state.elements = Array.isArray(els) ? els : [];
}

/** =========================
 *  Gaya Global dari Settings
 *  ========================= */
function applyThemeFromSettings(){
  const s = state.settings || {};
  document.documentElement.style.setProperty('--brand', s.theme_color || '#ef4444');
  if (s.content_width) document.documentElement.style.setProperty('--contentW', s.content_width + 'px');

  document.documentElement.style.setProperty('--hSize', (Number(s.heading_size||0)||28) + 'px');
  document.documentElement.style.setProperty('--bSize', (Number(s.body_size||0)||16) + 'px');
  document.documentElement.style.setProperty('--hColor', s.heading_color || '#111111');
  document.documentElement.style.setProperty('--bColor', s.body_color || '#374151');
  document.documentElement.style.setProperty('--hWeight', (String(s.heading_bold||'false')==='true') ? '800' : '700');
  document.documentElement.style.setProperty('--bWeight', (String(s.body_bold||'false')==='true') ? '600' : '400');
}

/** =========================
 *  Render Sections (sections_json)
 *  ========================= */
function renderSections(){
  sectionsHost.innerHTML = '';
  const s = state.sections || [];
  if (!s.length){
    const empty = document.createElement('div');
    empty.className = 'text-sm text-gray-500';
    empty.textContent = 'Tiada kandungan lagi.';
    sectionsHost.appendChild(empty);
    return;
  }
  s.forEach(sec => {
    if (sec.hidden) return; // skip jika ditanda sembunyi
    const card = document.createElement('section');
    card.className = 'card p-6';
    const header = document.createElement('div');
    header.className = 'flex items-center justify-between mb-2';
    const left = document.createElement('div');
    left.className = 'flex items-center gap-2';
    left.innerHTML = `<span class="sec-title">${esc(sec.title||'')}</span>`;
    const right = document.createElement('div');
    if (sec.featured){ right.innerHTML = `<span class="badge">Featured</span>`; }
    header.append(left,right);
    const body = document.createElement('div');
    body.className = 'sec-body mt-2';
    body.innerHTML = blocksToHTML(sec.blocks || []);
    card.append(header, body);
    sectionsHost.appendChild(card);
  });
}

function blocksToHTML(blocks){
  return (blocks||[]).map(b=>{
    if (b.kind==='text' || b.kind==='rich'){
      return `<div style="margin:.5rem 0">${b.html ? b.html : esc(b.value||'')}</div>`;
    } else if (b.kind==='image'){
      const u = esc(b.src||b.value||'');
      return u ? `<img src="${u}" alt="" class="w-full rounded-xl border border-gray-200 my-2">` : '';
    } else if (b.kind==='video'){
      const u = esc(b.src||b.value||''); if (!u) return '';
      const yt = parseYouTube(u);
      if (yt){
        return `
        <div class="relative pt-[56.25%] my-2">
          <iframe class="absolute inset-0 w-full h-full rounded-xl border border-gray-200" src="https://www.youtube.com/embed/${yt}" allowfullscreen></iframe>
        </div>`;
      }
      return `<video src="${u}" controls playsinline class="w-full rounded-xl border border-gray-200 my-2"></video>`;
    } else if (b.kind==='link'){
      const text = esc(b.text||'Pautan'); const u = esc(b.href||'#');
      return `<a href="${u}" target="_blank" class="btn my-2">${text}</a>`;
    } else if (b.kind==='social'){
      const u = esc(b.href||'#'); const col = esc(b.color||'#111111');
      return `<a href="${u}" target="_blank" class="inline-flex items-center gap-2 border border-gray-200 rounded-full px-3 py-1 text-sm mr-2" style="color:${col}">${(b.icon||'social').toUpperCase()}</a>`;
    } else if (b.kind==='button'){
      const text = esc(b.text||'Butang'); const u = esc(b.href||'#'); const col = esc(b.color||'#ef4444');
      return `<a href="${u}" target="_blank" class="inline-flex items-center gap-2 rounded-lg px-4 py-2 text-white my-2" style="background:${col}">${text}</a>`;
    }
    return '';
  }).join('');
}

function esc(s){ return String(s||''); }
function parseYouTube(url){
  try{
    const u = new URL(url);
    if (u.hostname.includes('youtube.com')) return u.searchParams.get('v');
    if (u.hostname.includes('youtu.be')) return u.pathname.slice(1);
  }catch(_){}
  return null;
}

/** =========================
 *  Canvas (elements_json) — untuk Preview Editor
 *  ========================= */
function buildCanvasFromElements(){
  // Jika tiada elemen & bukan editor, sembunyikan kanvas
  if ((!state.elements || !state.elements.length) && !EDITOR_MODE){
    document.getElementById('canvasHost').style.display = 'none';
    return;
  }
  canvasStage.innerHTML = `<div class="ghost-msg rounded">Editor aktif (melalui Dashboard) — boleh drag/resize klik elemen.</div>`;
  state.elementMap.clear();

  (state.elements||[]).forEach(el => addElementNode(el));

  // Beritahu dashboard elemen siap dimuat
  if (EDITOR_MODE){
    postToParent('elements-loaded', { elements: state.elements });
  }
}

function addElementNode(el){
  const div = document.createElement('div');
  div.className = 'el';
  div.dataset.id = el.id;
  div.dataset.type = el.type || 'text';
  applyElStyle(div, el);

  // Content per type
  if (el.type === 'text'){
    div.textContent = el.content || 'Text';
  } else if (el.type === 'button'){
    const a = document.createElement('a');
    a.href = el.href || '#';
    a.target = '_blank';
    a.textContent = el.content || 'Button';
    a.style.background = el.backgroundColor || '#ef4444';
    a.style.color = el.color || '#fff';
    a.style.padding = '.55rem .9rem';
    a.style.borderRadius = (el.borderRadius||8) + 'px';
    div.appendChild(a);
  } else if (el.type === 'image'){
    const img = document.createElement('img');
    img.src = el.src || 'https://picsum.photos/seed/mova/300/200.jpg';
    img.alt = '';
    img.style.borderRadius = (el.borderRadius||8) + 'px';
    div.appendChild(img);
  } else if (el.type === 'video'){
    if ((el.src||'').includes('youtube.com') || (el.src||'').includes('youtu.be')){
      const yt = parseYouTube(el.src||'');
      const ifr = document.createElement('iframe');
      ifr.src = 'https://www.youtube.com/embed/' + (yt || '');
      ifr.allowFullscreen = true;
      div.appendChild(ifr);
    } else {
      const v = document.createElement('video');
      v.src = el.src || '';
      v.controls = true; v.playsInline = true;
      div.appendChild(v);
    }
  } else if (el.type === 'icon'){
    const i = document.createElement('i');
    i.dataset.lucide = el.icon || 'smile';
    div.appendChild(i);
    setTimeout(()=> lucide.createIcons(), 0);
  } else if (el.type === 'shape'){
    // color via backgroundColor
  }

  // Click select (editor only)
  if (EDITOR_MODE){
    div.addEventListener('mousedown', (e)=> {
      e.stopPropagation();
      selectEl(div);
      // Hantar ke dashboard element terpilih
      postToParent('element-selected', { id: el.id });
    });
  }

  canvasStage.appendChild(div);
  state.elementMap.set(el.id, div);
}

function selectEl(div){
  document.querySelectorAll('.el.selected').forEach(n=> n.classList.remove('selected'));
  div.classList.add('selected');
}

function applyElStyle(node, el){
  // Kedudukan & saiz
  node.style.left = (el.x||100) + 'px';
  node.style.top = (el.y||100) + 'px';
  node.style.width = (el.width||200) + 'px';
  node.style.height = (el.height||100) + 'px';
  node.style.zIndex = (el.zIndex||0);

  // Warna/teks
  node.style.background = el.backgroundColor || 'transparent';
  node.style.color = el.color || '#000';
  node.style.opacity = (typeof el.opacity==='number' ? (el.opacity/100) : 1);

  // Border
  node.style.borderWidth = (el.borderWidth||0) + 'px';
  node.style.borderStyle = el.borderWidth ? 'solid' : 'none';
  node.style.borderColor = el.borderColor || '#000';
  node.style.borderRadius = (el.borderRadius||0) + 'px';

  // Tipografi (untuk text/button/icon)
  node.style.fontFamily = el.fontFamily || 'Inter';
  node.style.fontSize = (el.fontSize||24) + 'px';
  node.style.fontWeight = el.fontWeight || 'normal';
  node.style.fontStyle = el.fontStyle || 'normal';
  node.style.textDecoration = el.textDecoration || 'none';
  node.style.textAlign = el.textAlign || 'center';
}

/** =========================
 *  Interaksi Editor (drag/resize)
 *  ========================= */
function enableInteract(){
  interact('.el').draggable({
    listeners: {
      move (event) {
        const target = event.target;
        const id = target.dataset.id;
        const x = (parseFloat(target.style.left)||0) + event.dx;
        const y = (parseFloat(target.style.top)||0) + event.dy;
        target.style.left = x + 'px';
        target.style.top = y + 'px';
        // Beritahu dashboard
        postToParent('element-updated', { id, properties: { x, y }});
      }
    }
  }).resizable({
    edges: { left:true, right:true, bottom:true, top:true }
  }).on('resizemove', function (event) {
    const target = event.target;
    const id = target.dataset.id;
    const w = Math.max(40, event.rect.width);
    const h = Math.max(30, event.rect.height);
    target.style.width = w + 'px';
    target.style.height = h + 'px';
    // Beritahu dashboard
    postToParent('element-updated', { id, properties: { width:w, height:h }});
  });

  // Klik di kanvas kosong: buang pilihan
  canvasStage.addEventListener('mousedown', (e)=>{
    if (e.target === canvasStage){
      document.querySelectorAll('.el.selected').forEach(n=> n.classList.remove('selected'));
      postToParent('element-selected', { id: null });
    }
  });
}

/** =========================
 *  Messaging dgn Dashboard
 *  ========================= */
function setupPostMessage(){
  window.addEventListener('message', (event)=>{
    const msg = event.data || {};
    const { type, data } = msg;
    if (!type) return;

    if (type === 'load-elements'){
      state.elements = data.elements || [];
      buildCanvasFromElements();
    }
    else if (type === 'add-element'){
      state.elements.push(data);
      addElementNode(data);
    }
    else if (type === 'update-element'){
      const el = (state.elements||[]).find(x=> x.id === data.id);
      if (!el) return;
      Object.assign(el, data.properties||{});
      const node = state.elementMap.get(data.id);
      if (node){
        applyElStyle(node, el);
        if (el.type==='text' && 'content' in (data.properties||{})) node.textContent = el.content || 'Text';
        if (el.type==='button' && 'content' in (data.properties||{})) node.querySelector('a')?.textContent = el.content || 'Button';
        if (el.type==='button' && 'backgroundColor' in (data.properties||{})) node.querySelector('a')?.style.setProperty('background', el.backgroundColor || '#ef4444');
        if (el.type==='image' && 'src' in (data.properties||{})) node.querySelector('img')?.setAttribute('src', el.src || '');
        if (el.type==='video' && 'src' in (data.properties||{})) {
          // re-render video node ringkas
          node.innerHTML = '';
          if ((el.src||'').includes('youtube.com')||(el.src||'').includes('youtu.be')){
            const yt = parseYouTube(el.src||''); const ifr = document.createElement('iframe'); ifr.src='https://www.youtube.com/embed/'+(yt||''); ifr.allowFullscreen = true; node.appendChild(ifr);
          } else { const v=document.createElement('video'); v.src=el.src||''; v.controls=true; v.playsInline=true; node.appendChild(v); }
        }
        if (el.type==='icon' && ('icon' in (data.properties||{}))) { node.innerHTML=''; const i=document.createElement('i'); i.dataset.lucide = el.icon || 'smile'; node.appendChild(i); setTimeout(()=> lucide.createIcons(), 0); }
      }
      // pantulkan ke dashboard supaya sejarah/auto-save berlaku di sana
      postToParent('element-updated', { id: el.id, properties: data.properties });
    }
    else if (type === 'delete-element'){
      const idx = (state.elements||[]).findIndex(x=> x.id === data.id);
      if (idx>-1) state.elements.splice(idx,1);
      const node = state.elementMap.get(data.id);
      if (node && node.parentNode) node.parentNode.removeChild(node);
      state.elementMap.delete(data.id);
    }
    else if (type === 'bring-to-front'){
      const el = (state.elements||[]).find(x=> x.id === data.id);
      if (!el) return;
      const maxZ = Math.max(0, ...state.elements.map(e=> e.zIndex||0));
      el.zIndex = maxZ + 1;
      const node = state.elementMap.get(el.id); if (node) node.style.zIndex = el.zIndex;
    }
    else if (type === 'send-to-back'){
      const el = (state.elements||[]).find(x=> x.id === data.id);
      if (!el) return;
      const minZ = Math.min(0, ...state.elements.map(e=> e.zIndex||0));
      el.zIndex = minZ - 1;
      const node = state.elementMap.get(el.id); if (node) node.style.zIndex = el.zIndex;
    }
  });

  // Handshake awal: beritahu dashboard versi siap
  postToParent('elements-loaded', { elements: state.elements });
}

function postToParent(type, data){
  try{ window.parent.postMessage({ type, data }, '*'); }catch(_){}
}
</script>
</body>
</html>
