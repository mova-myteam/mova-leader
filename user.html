<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA — User</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --brand:#ef4444; --cw:980px;
      --hSize:28px; --hColor:#111; --hWeight:800;
      --bSize:16px; --bColor:#374151; --bWeight:400;
    }
    html,body{font-family:Inter,system-ui; background:#fff; color:var(--bColor); margin:0}
    .wrap{max-width:var(--cw); margin:0 auto; padding:20px}
    .h{font-size:var(--hSize); color:var(--hColor); font-weight:var(--hWeight); margin:0 0 8px}
    .p{font-size:var(--bSize); color:var(--bColor); font-weight:var(--bWeight); line-height:1.7; margin:0 0 10px}
    .btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--brand);color:#fff;
         padding:.7rem 1rem;border-radius:.8rem;text-decoration:none;font-weight:700}
    .card{border:1px solid #eee;border-radius:14px;padding:16px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    @media (max-width:900px){ .grid3{grid-template-columns:1fr} :root{--cw:92vw} }
    /* Canvas overlay (optional) */
    .canvas{position:relative}
    .el{position:absolute; pointer-events:none}
  </style>
</head>
<body>
  <main id="app" class="wrap"></main>

  <script>
  // ===== Design state =====
  const state = {
    design: window.__INIT__DESIGN__ || null
  };

  // ===== Utilities =====
  const $ = sel => document.querySelector(sel);
  const setTheme = (t={})=>{
    const r = document.documentElement;
    if (t.brand) r.style.setProperty('--brand', t.brand);
    if (t.contentWidth) r.style.setProperty('--cw', t.contentWidth+'px');
    if (t.heading){ r.style.setProperty('--hSize', (t.heading.size||28)+'px');
      r.style.setProperty('--hColor', t.heading.color||'#111');
      r.style.setProperty('--hWeight', (t.heading.bold?'800':'700')); }
    if (t.body){ r.style.setProperty('--bSize', (t.body.size||16)+'px');
      r.style.setProperty('--bColor', t.body.color||'#374151');
      r.style.setProperty('--bWeight', (t.body.bold?'600':'400')); }
  };
  const byId = (id)=> (state.design.sections || []).find(s=>s.id===id);

  // ===== Renderers =====
  const R = {
    hero: s=>{
      const d=s.data||{};
      return `
        <section style="display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin:28px 0">
          <div>
            <div class="p" style="color:#6b7280">${d.eyebrow||''}</div>
            <h1 class="h" style="font-size:clamp(28px,4vw,44px)">${d.title||''}</h1>
            <p class="p">${d.subtitle||''}</p>
            ${d.ctaText?`<a href="${d.ctaHref||'#'}" class="btn">${d.ctaText}</a>`:''}
          </div>
          ${d.image?`<img src="${d.image}" alt="" style="width:100%;border-radius:16px;border:1px solid #eee">`:''}
        </section>`;
    },
    features: s=>{
      const items=(s.data?.items)||[];
      return `
        <section style="margin:36px 0">
          <h2 class="h">Ciri Utama</h2>
          <div class="grid3">
            ${items.map(it=>`
              <div class="card">
                <div class="h" style="font-size:20px">${it.title||''}</div>
                <div class="p">${it.text||''}</div>
              </div>`).join('')}
          </div>
        </section>`;
    },
    video: s=>{
      const src=s.data?.src||'';
      if (!src) return '';
      const yt = parseYT(src);
      return `
        <section style="margin:36px 0">
          <div style="position:relative;padding-bottom:56%;height:0;overflow:hidden;border-radius:16px;border:1px solid #eee">
            ${yt
              ? `<iframe src="https://www.youtube.com/embed/${yt}" frameborder="0" allowfullscreen
                    style="position:absolute;inset:0;width:100%;height:100%"></iframe>`
              : `<video src="${src}" controls playsinline style="position:absolute;inset:0;width:100%;height:100%"></video>`}
          </div>
        </section>`;
    },
    testimonials: s=>{
      const items=s.data?.items||[];
      return `
        <section style="margin:36px 0">
          <h2 class="h">Testimoni</h2>
          <div class="grid3">
            ${items.map(it=>`
              <div class="card">
                <div class="p" style="font-style:italic">“${it.quote||''}”</div>
                <div class="p" style="color:#6b7280">— ${it.name||''}</div>
              </div>`).join('')}
          </div>
        </section>`;
    },
    cta: s=>{
      const d=s.data||{};
      return `
        <section class="card" style="margin:36px 0; text-align:center; padding:28px">
          <h2 class="h" style="margin-bottom:10px">${d.title||''}</h2>
          ${d.button?`<a href="${d.href||'#'}" class="btn">${d.button}</a>`:''}
        </section>`;
    },
    footer: s=>{
      const d=s.data||{};
      const links=(d.links||[]).map(l=>`<a href="${l.href}" class="p" style="text-decoration:none;color:#6b7280">${l.text}</a>`).join(' · ');
      return `
        <footer style="margin:48px 0 16px; border-top:1px solid #eee; padding-top:16px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap">
          <div class="p" style="color:#6b7280">${links}</div>
          <div class="p" style="color:#9ca3af">${d.copyright||''}</div>
        </footer>`;
    }
  };

  function parseYT(url){
    try{
      const u = new URL(url);
      if (u.hostname.includes('youtu.be')) return u.pathname.slice(1);
      if (u.hostname.includes('youtube.com')) return u.searchParams.get('v');
    }catch(_){}
    return null;
  }

  // ===== Main render =====
  function render(){
    const d = state.design;
    if (!d) return;
    setTheme(d.meta?.theme || {});
    const parts = (d.sections||[]).map(sec=>{
      const fn = R[sec.type];
      return fn ? fn(sec) : '';
    }).join('');
    $('#app').innerHTML = parts + renderCanvasOverlay(d);
  }
  function renderCanvasOverlay(d){
    if ((d.meta?.mode||'template') !== 'canvas') return '';
    const els = d.elements||[];
    return `<div class="canvas" style="height:0">
      ${els.map(el=>renderEl(el)).join('')}
    </div>`;
  }
  function renderEl(el){
    if (el.type==='text'){
      return `<div class="el" style="left:${el.x}px;top:${el.y}px;width:${el.width}px;height:${el.height}px;
        font-size:${el.fontSize||24}px;color:${el.color||'#111'};font-weight:${el.fontWeight||'400'};opacity:${(el.opacity??100)/100};
        text-align:${el.textAlign||'left'};z-index:${el.zIndex||1}">${el.content||''}</div>`;
    }
    if (el.type==='image'){
      return `<img class="el" src="${el.src}" style="left:${el.x}px;top:${el.y}px;width:${el.width}px;height:${el.height}px;object-fit:cover;border-radius:${el.borderRadius||0}px;opacity:${(el.opacity??100)/100};z-index:${el.zIndex||1};">`;
    }
    // boleh tambah video/button/shape/icon
    return '';
  }

  // ===== Message API (dari dashboard) =====
  window.addEventListener('message', (e)=>{
    const { type, data } = e.data || {};
    if (!type) return;

    if (type==='load-design'){ state.design = normalizeDesign(data); render(); }
    if (type==='apply-theme'){ state.design.meta = state.design.meta||{}; state.design.meta.theme = {...(state.design.meta.theme||{}), ...(data||{})}; render(); }
    if (type==='update-field'){ // data: {path:'sections.hero.data.title', value:'...'}
      try{
        applyPath(state.design, data.path, data.value);
        render();
      }catch(_){}
    }
    if (type==='load-elements'){ // support array atau {elements:[...]}
      const arr = Array.isArray(data)? data : (Array.isArray(data?.elements)? data.elements: []);
      state.design.elements = arr;
      state.design.meta = state.design.meta||{}; state.design.meta.mode='canvas';
      render();
    }
    if (type==='update-element'){ // data:{id, properties:{}}
      const i=(state.design.elements||[]).findIndex(x=>x.id===data.id);
      if (i>-1){ Object.assign(state.design.elements[i], data.properties||{}); render(); }
    }
    if (type==='delete-element'){
      state.design.elements = (state.design.elements||[]).filter(x=>x.id!==data.id); render();
    }
  });

  // ===== Helpers =====
  function normalizeDesign(d){
    // fallback minimum if dashboard belum hantar apa-apa
    if (!d || !Array.isArray(d.sections)) {
      return {
        meta:{ mode:'template', theme:{} },
        sections:[
          {id:'hero',type:'hero',locked:true,data:{eyebrow:'MOVA',title:'Selamat Datang',subtitle:'Edit dari dashboard.',ctaText:'Mula',ctaHref:'#',image:'https://picsum.photos/seed/mova/960/600'}},
          {id:'features',type:'features',locked:true,data:{items:[{title:'Ciri 1',text:'Ringkas.'},{title:'Ciri 2',text:'Cepat.'},{title:'Ciri 3',text:'Premium.'}]}},
          {id:'cta',type:'cta',locked:true,data:{title:'Ready?',button:'Hubungi',href:'#'}},
          {id:'footer',type:'footer',locked:true,data:{links:[{text:'Privasi',href:'#'}],copyright:'© '+new Date().getFullYear()+' MOVA'}}
        ],
        elements:[]
      };
    }
    return d;
  }
  function applyPath(obj, path, value){
    const keys = path.split('.');
    let cur = obj;
    for (let i=0;i<keys.length-1;i++){
      const k = keys[i];
      if (!(k in cur)) cur[k] = {};
      cur = cur[k];
    }
    cur[keys[keys.length-1]] = value;
  }

  // ===== Boot =====
  (function boot(){
    const url = new URL(location.href);
    const mode = url.searchParams.get('mode'); // optional
    state.design = normalizeDesign(null);
    if (mode) { state.design.meta.mode = mode; }
    render();
  })();
  </script>
</body>
</html>
