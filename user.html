<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA — Untuk Pengguna (Free Users)</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { --brand:#ef4444; }
    html,body{font-family:Inter,system-ui,ui-sans-serif;background:#fafafa}
    .btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:.75rem;padding:.7rem 1rem;font-weight:700}
    .btn-primary{background:var(--brand);color:#fff}
    .btn-ghost{background:#fff;border:1px solid #e5e7eb;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;box-shadow:0 6px 24px rgba(15,23,42,.06)}
  </style>
</head>

<body class="min-h-screen">

  <main id="page" class="space-y-6 p-4 md:p-8 max-w-5xl mx-auto"></main>

  <script>
    const EDIT_MODE = window.location.search.includes('edit=1');
    let pageSections = [];

    function createSectionElement(section) {
      const el = document.createElement("section");
      el.dataset.sectionId = section.id;
      el.className = "card p-6";
      if (section.style && section.style !== 'default') {
        el.classList.add(`section-style-${section.style}`);
      }

      if (section.blocks) {
        for (const block of section.blocks) {
          const blockEl = document.createElement(block.tag || "div");
          blockEl.textContent = block.text || "";
          if (block.type === "image") {
            const img = document.createElement("img");
            img.src = block.src || "";
            img.alt = block.alt || "";
            img.className = "w-full rounded-xl mb-3";
            blockEl.appendChild(img);
          } else if (block.type === "video") {
            const vid = document.createElement("iframe");
            vid.src = block.src || "";
            vid.className = "w-full aspect-video rounded-xl mb-3";
            vid.allowFullscreen = true;
            blockEl.appendChild(vid);
          }
          el.appendChild(blockEl);
        }
      }
      return el;
    }

    function renderPage() {
      const page = document.getElementById("page");
      page.innerHTML = "";
      for (const section of pageSections) {
        const sectionEl = createSectionElement(section);
        page.appendChild(sectionEl);
      }

      // 修复: Hantar isyarat setiap kali halaman siap render semula
      if (EDIT_MODE) {
        window.parent?.postMessage({
          type: 'sections-loaded',
          data: { sections: pageSections }
        }, '*');
        console.log("sections-loaded dihantar semula selepas renderPage()");
      }
    }

    // ===============================
    // Mesej dari dashboard.html
    // ===============================
    function handleIframeMessage(event) {
      const { type, data } = event.data || {};
      if (!type) return;

      switch (type) {
        case "load-sections":
          pageSections = data.sections || [];
          renderPage();
          break;
        case "update-section":
          const sec = pageSections.find(s => s.id === data.id);
          if (sec) Object.assign(sec, data);
          renderPage();
          break;
        case "add-element":
          const target = pageSections.find(s => s.id === data.sectionId);
          if (target && target.blocks) {
            target.blocks.push(data.block);
            renderPage();
          }
          break;
        case "update-element":
          const tgt = pageSections.find(s => s.id === data.sectionId);
          if (tgt && tgt.blocks) {
            const blk = tgt.blocks.find(b => b.id === data.block.id);
            if (blk) Object.assign(blk, data.block);
            renderPage();
          }
          break;
        case "delete-element":
          const delSec = pageSections.find(s => s.id === data.sectionId);
          if (delSec && delSec.blocks) {
            delSec.blocks = delSec.blocks.filter(b => b.id !== data.blockId);
            renderPage();
          }
          break;
        case "deselect-all":
          document.querySelectorAll(".selected").forEach(el => el.classList.remove("selected"));
          break;
        case "apply-command":
          document.execCommand(data.command, false, data.value || null);
          break;
      }
    }

    window.addEventListener("message", handleIframeMessage);

    document.addEventListener("DOMContentLoaded", () => {
      if (EDIT_MODE) {
        window.parent?.postMessage({
          type: 'sections-loaded',
          data: { sections: pageSections }
        }, '*');
        console.log("sections-loaded dihantar pada DOMContentLoaded");
      }
    });
  </script>

</body>
</html>
