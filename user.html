<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA — Laman User</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind (CDN; guna CLI untuk production) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --brand:#ef4444;
      --hSize:28px; --hColor:#111111; --hWeight:800;
      --bSize:16px; --bColor:#374151; --bWeight:400;
      --contentWidth: 980px;
    }
    html,body{font-family:Inter,system-ui,ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial}
    .chip{display:inline-flex;align-items:center;gap:.5rem;border:1px solid #e5e7eb;background:#fff;border-radius:9999px;padding:.35rem .6rem;font-size:.75rem;color:#374151}
    .btn-brand{background:var(--brand);color:#fff;border-radius:.75rem;padding:.6rem 1rem;font-weight:700}
    .btn-brand:hover{filter:brightness(.95)}
    .container-narrow{max-width:var(--contentWidth);margin:0 auto}
    .hero-title{font-size:var(--hSize);color:var(--hColor);font-weight:var(--hWeight);line-height:1.15}
    .body-text{font-size:var(--bSize);color:var(--bColor);font-weight:var(--bWeight);line-height:1.7}
    .section + .section{margin-top:3rem}
    .img-rounded{border-radius:1rem}
  </style>
</head>
<body class="bg-white text-slate-900">

  <!-- Top rail (kecil) -->
  <div class="sticky top-0 z-30 bg-white/85 backdrop-blur border-b border-slate-200">
    <div class="container-narrow px-4 h-12 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="h-7 w-7 rounded-lg bg-[color:var(--brand)] text-white grid place-items-center text-[13px] font-bold">M</div>
        <div class="text-sm text-slate-600">Laman User</div>
      </div>
      <a href="./index.html" class="text-sm text-slate-500 hover:text-slate-800">Log Masuk</a>
    </div>
  </div>

  <!-- CONTENT -->
  <main class="container-narrow px-4 py-8">
    <!-- HERO -->
    <section id="hero" class="section">
      <div class="chip mb-3" data-role="hero-kicker">MOVA</div>
      <h1 class="hero-title mt-2" data-role="hero-title">
        Belanja, Kumpul Cashback, Naik Taraf Masa Depan — dengan MOVA.
      </h1>
      <p class="body-text mt-4 max-w-3xl" data-role="hero-sub">
        Mulakan sebagai Free user, fahami cara berfungsi, dan bila bersedia anda boleh naik taraf ke Silver/Gold/Diamond di bawah bimbingan Leader.
      </p>

      <div class="mt-5 flex items-center gap-3 flex-wrap">
        <a class="btn-brand" data-role="hero-cta" href="#daftar">Daftar Sekarang</a>
        <span class="chip" data-role="hero-badge">Cashback 5%–10%</span>
      </div>
    </section>

    <!-- BLOCKS (auto dari sections_json) -->
    <section id="blocks" class="section"></section>
  </main>

  <script>
    // ================== KONFIG ==================
    const EXEC_URL = "https://script.google.com/macros/s/AKfycbylAgFpv3cyZV7jPQFF8ROBB2nEIRTdF-Go6UtHQ4YN8KfAqGa914hTtiwmVeq0XtM/exec";

    // Ambil session (jika ada)
    let leader = {};
    try { leader = JSON.parse(localStorage.getItem('mova_leader')||'{}') || {}; } catch(e){ leader = {}; }
    const leader_id = leader?.leader_id || ''; // boleh kosong; server kita benarkan settings umum

    // ================== UTIL ==================
    const $ = sel => document.querySelector(sel);
    function safeJSON(s, def){ try{ return JSON.parse(s||''); } catch(_){ return def; } }
    function setVar(name, val){ document.documentElement.style.setProperty(name, val); }

    // ================== RENDER HELPERS ==================
    function applyThemeFromSettings(s){
      // Tema & typography global
      if (s?.theme_color) setVar('--brand', s.theme_color);
      if (s?.content_width) setVar('--contentWidth', s.content_width+'px');

      const hSize  = Number(s?.heading_size || 0) || 28;
      const bSize  = Number(s?.body_size   || 0) || 16;
      const hColor = s?.heading_color || '#111111';
      const bColor = s?.body_color    || '#374151';
      const hBold  = String(s?.heading_bold||'false')==='true';
      const bBold  = String(s?.body_bold   ||'false')==='true';

      setVar('--hSize',  hSize+'px');
      setVar('--bSize',  bSize+'px');
      setVar('--hColor', hColor);
      setVar('--bColor', bColor);
      setVar('--hWeight', hBold? '800':'700');
      setVar('--bWeight', bBold? '600':'400');
    }

    function htmlEscape(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    function renderBlocks(sec){
      const blocksHost = $('#blocks');
      blocksHost.innerHTML = '';
      const blocks = Array.isArray(sec?.blocks) ? sec.blocks : [];

      if (!blocks.length){ return; }

      blocks.forEach(b=>{
        let node = document.createElement('div');
        node.className = 'mb-6';

        if (b.kind==='text' || b.kind==='rich'){
          const html = b.html || b.value || '';
          node.innerHTML = `<div class="body-text">${html}</div>`;
        }
        else if (b.kind==='image'){
          const u = b.src || b.value || '';
          if (u) node.innerHTML = `<img class="w-full img-rounded border border-slate-200" src="${htmlEscape(u)}" alt="">`;
          else node.innerHTML = `<div class="text-sm text-slate-400">[Gambar belum ditetapkan]</div>`;
        }
        else if (b.kind==='video'){
          const u = b.src || b.value || '';
          if (!u){ node.innerHTML = `<div class="text-sm text-slate-400">[Video belum ditetapkan]</div>`; }
          else {
            const yt = parseYouTube(u);
            if (yt){
              node.innerHTML = `
                <div class="relative" style="padding-bottom:56.25%">
                  <iframe class="absolute inset-0 w-full h-full rounded-xl border border-slate-200"
                          src="https://www.youtube.com/embed/${yt}" frameborder="0" allowfullscreen></iframe>
                </div>`;
            }else{
              node.innerHTML = `<video class="w-full rounded-xl border border-slate-200" src="${htmlEscape(u)}" controls playsinline></video>`;
            }
          }
        }
        else if (b.kind==='link'){
          const text = b.text || 'Pautan';
          const href = b.href || '#';
          node.innerHTML = `<a href="${htmlEscape(href)}" target="_blank" class="btn-brand inline-flex">${htmlEscape(text)}</a>`;
        }
        else if (b.kind==='social'){
          const u = b.href || '#';
          const col = b.color || '#111111';
          const label = (b.icon || 'Sosial').toUpperCase();
          node.innerHTML = `<a href="${htmlEscape(u)}" target="_blank" class="chip" style="color:${htmlEscape(col)}">${htmlEscape(label)}</a>`;
        }
        else if (b.kind==='button'){
          const text = b.text || 'Butang';
          const href = b.href || '#';
          const col  = b.color || 'var(--brand)';
          node.innerHTML = `<a href="${htmlEscape(href)}" target="_blank" class="inline-flex px-4 py-2 rounded-lg text-white font-semibold" style="background:${htmlEscape(col)}">${htmlEscape(text)}</a>`;
        }

        blocksHost.appendChild(node);
      });
    }

    function parseYouTube(url){
      try{
        const u = new URL(url);
        if (u.hostname.includes('youtube.com')) return u.searchParams.get('v');
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1);
      }catch(_){}
      return null;
    }

    // ================== MAIN ==================
    (async function init(){
      try{
        // 1) Panggil settings_get
        const res = await fetch(EXEC_URL, {
          method:'POST',
          headers:{ 'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8' },
          body: new URLSearchParams({ path:'settings_get', payload: JSON.stringify({ leader_id }) })
        });
        const txt = await res.text();
        let out; try { out = JSON.parse(txt); } catch(e){ out = {}; }
        const s = out?.settings || {};

        // 2) Apply tema & typography
        applyThemeFromSettings(s);

        // 3) Render dari sections_json (utama)
        const sections = safeJSON(s.sections_json, []);
        let hero = null;

        // Cari seksyen featured=hero / type=hero, atau guna index 0
        if (Array.isArray(sections) && sections.length){
          hero = sections.find(x => (x.type==='hero') || x.featured) || sections[0];
        }

        if (hero){
          // Kicker / Brand label
          $('[data-role="hero-kicker"]').textContent = (hero.kicker || s.brand_label || 'MOVA');

          // Tajuk + Sub
          if (hero.title_html){
            $('[data-role="hero-title"]').innerHTML = hero.title_html;
          } else if (hero.title){
            $('[data-role="hero-title"]').textContent = hero.title;
          } // else biar default

          if (hero.sub_html){
            $('[data-role="hero-sub"]').innerHTML = hero.sub_html;
          } else if (hero.sub){
            $('[data-role="hero-sub"]').textContent = hero.sub;
          }

          // CTA & badge (opsyenal)
          if (hero.cta_text){
            const cta = $('[data-role="hero-cta"]');
            cta.textContent = hero.cta_text;
            if (hero.cta_href) cta.href = hero.cta_href;
          }
          if (hero.badge_text){
            $('[data-role="hero-badge"]').textContent = hero.badge_text;
          }

          // Blok-blok
          renderBlocks(hero);
        } else {
          // tiada sections_json — paparkan default + cuba render blocks dari lalai kosong
          renderBlocks({ blocks: [] });
        }

        // 4) (Opsyenal) Jika anda mahu tunjuk imej hero jika diset
        // contoh: jika hero.image_url wujud dan ingin papar
        // if (hero?.image_url) {
        //   const imgWrap = document.createElement('div');
        //   imgWrap.className = 'mt-6';
        //   imgWrap.innerHTML = `<img class="w-full img-rounded border border-slate-200" src="${htmlEscape(hero.image_url)}" alt="">`;
        //   document.querySelector('main').appendChild(imgWrap);
        // }

      }catch(e){
        // fallback lalai — biarkan kandungan default
        console.warn('Gagal memuat settings:', e);
      }
    })();
  </script>
</body>
</html>
