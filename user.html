<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA — Untuk Pengguna</title>

  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { --brand:#ef4444; }
    html,body{font-family:Inter,system-ui,ui-sans-serif;background:#fafafa;min-height:100vh}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;box-shadow:0 6px 24px rgba(15,23,42,.06)}
    .content-block{position:absolute;transform-origin:top left;}
    .fallback{color:#6b7280;text-align:center;padding:4rem 1rem;}
    .link-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.6rem 1rem;border-radius:.75rem;border:1px solid #e5e7eb;background:#fff;font-weight:600;}
    .hero-title{font-weight:800;line-height:1.1}
    .rich *{word-break:break-word;}
  </style>
</head>
<body>

<!-- NAV -->
<nav class="bg-white border-b border-gray-200">
  <div class="mx-auto container px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-xl bg-[color:var(--brand)] text-white grid place-items-center">
        <i data-lucide="rocket" class="w-5 h-5"></i>
      </div>
      <div class="font-extrabold text-lg">MOVA</div>
    </div>
  </div>
</nav>

<!-- KANDUNGAN -->
<main id="mainWrap" class="relative container mx-auto px-4 sm:px-6 lg:px-8 py-10 min-h-[80vh]">
  <div id="loading" class="text-center text-gray-500 text-sm">Memuatkan kandungan...</div>
</main>

<footer class="mt-16 py-8 text-center text-sm text-gray-500">
  © <span id="year"></span> MOVA. Hak cipta terpelihara.
</footer>

<!-- TOAST -->
<div id="toast" class="fixed left-1/2 bottom-6 transform -translate-x-1/2 bg-black text-white px-4 py-2 rounded-lg shadow hidden"></div>

<script>
const EXEC_URL = "https://script.google.com/macros/s/AKfycbylAgFpv3cyZV7jPQFF8ROBB2nEIRTdF-Go6UtHQ4YN8KfAqGa914hTtiwmVeq0XtM/exec";
document.getElementById('year').textContent = new Date().getFullYear();
lucide.createIcons();

// UTIL
const toastEl=document.getElementById('toast');
function toast(msg,ms=2500){toastEl.textContent=msg;toastEl.classList.remove('hidden');clearTimeout(toastEl._t);toastEl._t=setTimeout(()=>toastEl.classList.add('hidden'),ms);}
async function api(path,payload){
  const res=await fetch(EXEC_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams({path,payload:JSON.stringify(payload||{})})});
  const text=await res.text();let json;try{json=JSON.parse(text)}catch(e){throw new Error(text)}if(json&&json.success===false)throw new Error(json.error||'Ralat tidak diketahui');return json;
}

// RENDER
(async function init(){
  try{
    const out = await api('settings_get',{});
    const sets = out.settings || {};
    const secs = sets.sections || [];
    document.documentElement.style.setProperty('--brand', sets.theme_primary || '#ef4444');
    if(!secs.length) return renderEmpty();

    renderCanvasLayout(secs, sets);
  }catch(e){
    renderEmpty();
  }
})();

function renderEmpty(){
  const wrap=document.getElementById('mainWrap');
  wrap.innerHTML='<div class="fallback">Laman belum disediakan oleh Leader.</div>';
}

function renderCanvasLayout(sections, settings){
  const wrap=document.getElementById('mainWrap');
  wrap.innerHTML='';
  wrap.classList.add('relative');
  const color = settings.theme_primary || '#ef4444';
  const headingColor = settings.heading_color || '#111';
  const bodyColor = settings.body_color || '#333';

  sections.forEach(sec=>{
    const secWrap = document.createElement('section');
    secWrap.className='relative w-full min-h-[400px] mb-16 bg-white/80 rounded-xl shadow-sm overflow-hidden';
    secWrap.innerHTML=`<div class="absolute inset-0" id="canvas-${sec.id||Math.random().toString(36).slice(2)}"></div>`;
    wrap.appendChild(secWrap);
    const canvas = secWrap.querySelector('div');

    (sec.blocks||[]).forEach(block=>{
      const el=document.createElement('div');
      el.className='content-block';
      const lay = block.layout || {};
      el.style.left=(lay.x||20)+'px';
      el.style.top=(lay.y||20)+'px';
      if(lay.w) el.style.width=lay.w+'px';
      if(lay.h) el.style.height=lay.h+'px';

      if(block.kind==='text'){
        el.innerHTML=`<div class="rich" style="color:${bodyColor};font-size:${settings.body_size||16}px;">${block.value||''}</div>`;
      }
      else if(block.kind==='image' && block.value){
        el.innerHTML=`<img src="${block.value}" class="w-full h-full object-cover rounded-lg border">`;
      }
      else if(block.kind==='video' && block.value){
        const yt=parseYouTube(block.value);
        el.innerHTML=yt
          ? `<iframe src="https://www.youtube.com/embed/${yt}" class="w-full h-full rounded-lg border" frameborder="0" allowfullscreen></iframe>`
          : `<video src="${block.value}" controls playsinline class="w-full h-full rounded-lg border"></video>`;
      }
      else if(block.kind==='link'){
        el.innerHTML=`<a href="${block.value||'#'}" target="_blank" class="link-btn"><i data-lucide="link" class="w-4 h-4"></i><span>${block.text||'Pautan'}</span></a>`;
      }
      else if(block.kind==='social'){
        el.innerHTML=`<div class="link-btn"><i data-lucide="share-2" class="w-4 h-4"></i><span>${block.text||'Sosial'}</span></div>`;
      }
      else if(block.kind==='button'){
        el.innerHTML=`<a href="${block.value||'#'}" target="_blank" class="btn px-4 py-2 rounded-lg text-white font-semibold" style="background:${color}">${block.text||'Butang'}</a>`;
      }
      canvas.appendChild(el);
    });
  });
  lucide.createIcons();
}

function parseYouTube(url){
  try{
    const u=new URL(url);
    if(u.hostname.includes('youtube.com')) return u.searchParams.get('v');
    if(u.hostname.includes('youtu.be')) return u.pathname.slice(1);
  }catch(_){}
  return null;
}
</script>
</body>
</html>
