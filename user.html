<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA — User Canvas</title>

  <!-- Font & Tailwind -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>

  <style>
    :root { --brand:#ef4444; }
    html,body{font-family:Inter,system-ui,ui-sans-serif;background:#f9fafb;margin:0;overflow-x:hidden;}
    .canvas-area{position:relative;min-height:100vh;background:#fff;margin:0 auto;max-width:1200px;overflow:hidden;}
    .draggable{position:absolute;cursor:move;border:1px dashed transparent;padding:4px;min-width:50px;min-height:20px;}
    .draggable.active{border-color:#ef4444;}
    .resize-handle{position:absolute;width:10px;height:10px;background:#ef4444;right:-5px;bottom:-5px;border-radius:2px;cursor:se-resize;}
    .toolbar{position:fixed;top:0;left:0;right:0;height:48px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;gap:1rem;z-index:999;}
    .toolbar button{background:#ef4444;color:#fff;font-weight:700;padding:.4rem .9rem;border-radius:.5rem;}
  </style>
</head>
<body>

<!-- Toolbar ringkas -->
<div class="toolbar">
  <button onclick="addText()">Tambah Teks</button>
  <button onclick="addImage()">Tambah Imej</button>
  <button onclick="clearCanvas()">Padam Semua</button>
</div>

<!-- Kawasan kerja -->
<div id="canvas" class="canvas-area"></div>

<script>
const canvas=document.getElementById('canvas');
let elements=[];let activeEl=null;

//==== tambah teks / imej secara manual ====
function addText(){
  const el=document.createElement('div');
  el.className='draggable';
  el.textContent='Teks Baharu';
  el.style.left='100px';el.style.top='100px';
  el.contentEditable=true;
  enableDragResize(el);
  canvas.appendChild(el);
  elements.push(el);
}
function addImage(){
  const el=document.createElement('img');
  el.src='https://via.placeholder.com/150';
  el.className='draggable';
  el.style.left='150px';el.style.top='150px';el.style.width='150px';
  enableDragResize(el);
  canvas.appendChild(el);
  elements.push(el);
}
function clearCanvas(){
  canvas.innerHTML='';
  elements=[];
}

//==== drag & resize ====
function enableDragResize(el){
  el.addEventListener('click',()=>{document.querySelectorAll('.draggable').forEach(d=>d.classList.remove('active'));el.classList.add('active');activeEl=el;});
  interact(el)
    .draggable({
      listeners:{move(event){
        const x=(parseFloat(el.getAttribute('data-x'))||0)+event.dx;
        const y=(parseFloat(el.getAttribute('data-y'))||0)+event.dy;
        el.style.transform=`translate(${x}px,${y}px)`;
        el.setAttribute('data-x',x);
        el.setAttribute('data-y',y);
      }}
    })
    .resizable({
      edges:{bottom:true,right:true},
    })
    .on('resizemove',event=>{
      let {width,height}=event.rect;
      el.style.width=width+'px';
      el.style.height=height+'px';
    });
}

//==== listener dari dashboard ====
window.addEventListener('message',(e)=>{
  const {type,data}=e.data||{};
  if(!type)return;

  if(type==='add-element'){
    if(data.kind==='text')addText();
    if(data.kind==='image')addImage();
  }

  if(type==='update-element' && activeEl){
    if(data.color)activeEl.style.color=data.color;
    if(data.fontSize)activeEl.style.fontSize=data.fontSize+'px';
    if(data.content!==undefined)activeEl.textContent=data.content;
  }

  if(type==='load-elements'){
    clearCanvas();
    (data||[]).forEach(item=>{
      const el=item.tag==='img'?document.createElement('img'):document.createElement('div');
      el.className='draggable';
      if(item.tag==='img'){el.src=item.src;}
      else{el.textContent=item.text;}
      Object.assign(el.style,item.style||{});
      el.style.position='absolute';
      enableDragResize(el);
      canvas.appendChild(el);
      elements.push(el);
    });
  }
});

//==== fungsi simpan ke dashboard ====
function saveToDashboard(){
  const out=[...canvas.querySelectorAll('.draggable')].map(el=>{
    return{
      tag:el.tagName.toLowerCase(),
      text:el.textContent,
      src:el.src,
      style:{
        left:el.style.left,
        top:el.style.top,
        width:el.style.width,
        height:el.style.height,
        color:el.style.color,
        fontSize:el.style.fontSize,
      }
    };
  });
  parent.postMessage({type:'save-elements',data:out},'*');
}

// auto simpan bila ubah
canvas.addEventListener('input',saveToDashboard);
window.addEventListener('mouseup',saveToDashboard);
</script>
</body>
</html>
