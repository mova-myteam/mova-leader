<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA — Untuk Pengguna (Free Users)</title>

  <!-- Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide (fixed src spacing) -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { --brand:#ef4444; }
    html,body{font-family:Inter,system-ui,ui-sans-serif;background:#fafafa}
    .btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:.75rem;padding:.7rem 1rem;font-weight:700}
    .btn-primary{background:var(--brand);color:#fff}
    .btn-ghost{background:#fff;border:1px solid #e5e7eb;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;box-shadow:0 6px 24px rgba(15,23,42,.06)}
    .input{width:100%;border:1px solid #d1d5db;border-radius:.75rem;padding:.7rem .9rem;background:#fff;}
    .input:focus{outline:none;box-shadow:0 0 0 2px #111}
    .badge{display:inline-flex;align-items:center;border-radius:9999px;padding:.15rem .6rem;font-size:.75rem;background:#f3f4f6;color:#374151}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#111;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9999}
    .section-title{font-weight:800;font-size:1.25rem}
    .muted{color:#6b7280}

    /* --- Gaya Untuk Mod Edit & Bahagian --- */
    .edit-mode .page-section { outline: 1px dashed #d1d5db; outline-offset: -1px; transition: outline 0.2s ease }
    .edit-mode .page-section:hover { outline: 1px dashed #9ca3af }
    .page-section.selected { outline: 2px solid #3b82f6 !important; outline-offset: -2px }

    /* Grid 12 lajur untuk susun elemen */
    .section-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 1rem }

    .page-element { cursor: pointer; transition: box-shadow 0.2s ease }
    .page-element.selected { outline: 2px solid #10b981; outline-offset: 2px }

    /* RTE */
    .rtbox { min-height:120px; border:1px solid #d1d5db; border-radius:.75rem; padding:.6rem; background:#fff }
    .toolbar { display:flex; flex-wrap:wrap; gap:.25rem; margin-bottom:.5rem }
    .toolbar button { border:1px solid #e5e7eb; border-radius:.5rem; padding:.25rem .5rem; background:#fff; transition: all .2s ease }
    .toolbar button:hover { background:#f3f4f6 }
    .toolbar button.active { background:#111; color:#fff; border-color:#111 }
    .toolbar select { transition: all .2s ease }
    .toolbar select:focus { background:#f9fafb }

    /* Sosial */
    .social-icon { display:inline-flex; align-items:center; gap:.5rem; font-size: var(--icon-size, 24px); color: var(--icon-color, #374151); transition: transform .2s ease }
    .social-icon:hover { transform: translateY(-2px) }
  </style>
</head>
<body>

<!-- NAV (fixed structure + closing tags) -->
<nav class="bg-white border-b border-gray-200">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-9 w-9 rounded-xl bg-[color:var(--brand)] text-white grid place-items-center">
        <i data-lucide="rocket" class="w-5 h-5"></i>
      </div>
      <div class="font-extrabold">MOVA</div>
    </div>
    <div class="hidden sm:flex items-center gap-6 text-sm">
      <a href="#intro" class="hover:underline">Apa itu MOVA</a>
      <a href="#calc" class="hover:underline">Anggaran Cashback</a>
      <a href="#upgrade" class="hover:underline">Naik Taraf</a>
      <a href="#faq" class="hover:underline">FAQ</a>
    </div>
  </div>
</nav>

<!-- MAIN — bahagian dijana dinamik -->
<main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-8 space-y-8" id="main">
  <!-- Bahagian-bahagian halaman akan dimuatkan di sini oleh JavaScript -->
</main>

<footer class="mt-10 py-10 text-center text-sm text-gray-500">
  © <span id="year"></span> MOVA. <span class="text-gray-500">Hak cipta terpelihara terkini.</span>
</footer>

<div id="toast" class="toast hidden"></div>

<script>
  const EXEC_URL = "https://script.google.com/macros/s/AKfycbylAgFpv3cyZV7jPQFF8ROBB2nEIRTdF-Go6UtHQ4YN8KfAqGa914hTtiwmVeq0XtM/exec"; // dikekalkan

  function toast(msg, ms = 2200) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.remove('hidden');
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.add('hidden'), ms);
  }

  async function api(path, payload) {
    const res = await fetch(EXEC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
      body: new URLSearchParams({ path, payload: JSON.stringify(payload || {}) })
    });
    const text = await res.text(); // (fixed: invoke .text())
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error(text); }
    if (json && json.success === false) throw new Error(json.error || 'Ralat tidak diketahui');
    return json;
  }

  // --- LOGIK EDITOR ---
  const EDIT_MODE = new URLSearchParams(location.search).get('edit') === '1';
  let pageSections = []; // semua BAHAGIAN disimpan di sini

  if (EDIT_MODE) {
    window.addEventListener('message', handleIframeMessage);
    document.body.classList.add('edit-mode');
  }

  function handleIframeMessage(event) {
    const { type, data, on } = event.data || {};
    switch (type) {
      case 'toggle-edit':
        document.body.classList.toggle('edit-mode', !!on);
        break;
      case 'load-sections':
        pageSections = (data && data.sections) || [];
        renderPage();
        break;
      case 'select-section': {
        document.querySelectorAll('.page-section.selected').forEach(el => el.classList.remove('selected'));
        const sectionEl = document.querySelector(`[data-section-id="${data.id}"]`);
        if (sectionEl) {
          sectionEl.classList.add('selected');
          sectionEl.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
        }
        break; }
      case 'select-element': {
        document.querySelectorAll('.page-element.selected').forEach(el => el.classList.remove('selected'));
        const elSel = document.querySelector(`[data-id="${data.id}"]`);
        if (elSel) {
          elSel.classList.add('selected');
          elSel.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
        }
        break; }
      case 'add-element':
        addElement(data.sectionId, data.element);
        break;
      case 'update-element': {
        const elUpd = document.querySelector(`[data-id="${data.id}"]`);
        if (elUpd && data.properties) Object.assign(elUpd.style, data.properties);
        break; }
      case 'apply-command': {
        const elRte = document.querySelector('.page-element.selected .rtbox');
        if (elRte && data && data.command) document.execCommand(data.command, false, null);
        break; }
    }
  }

  function renderPage() {
    const mainContent = document.getElementById('main');
    if (!mainContent) return;
    mainContent.innerHTML = '';

    pageSections.forEach(section => {
      const sectionNode = createSectionNode(section);
      if (sectionNode) mainContent.appendChild(sectionNode);
    });

    if (EDIT_MODE) {
      makeSectionsSelectable();
      makeElementsSelectable();
    }

    // refresh ikon lucide selepas render
    if (window.lucide && typeof window.lucide.createIcons === 'function') {
      window.lucide.createIcons();
    }
  }

  function createSectionNode(section) {
    const sectionDiv = document.createElement('section');
    sectionDiv.className = 'page-section';
    sectionDiv.dataset.id = section.id;
    sectionDiv.dataset.sectionId = section.id;

    Object.assign(sectionDiv.style, {
      backgroundColor: section.backgroundColor || 'transparent',
      padding: section.padding || '4rem 1rem',
      borderRadius: `${section.borderRadius || 0}px`
    });

    const grid = document.createElement('div');
    grid.className = 'section-grid';

    (section.elements || []).forEach(el => {
      const elementNode = createElementNode(el);
      if (elementNode) grid.appendChild(elementNode);
    });

    sectionDiv.appendChild(grid);
    return sectionDiv;
  }

  function createElementNode(el) {
    const wrapper = document.createElement('div');
    wrapper.className = 'page-element';
    wrapper.dataset.id = el.id;
    wrapper.dataset.sectionId = el.sectionId || '';
    wrapper.style.gridColumn = el.gridColumn || 'span 12 / span 12';
    wrapper.style.textAlign = el.textAlign || 'left';
    wrapper.style.zIndex = el.zIndex || 1;
    wrapper.style.opacity = (el.opacity == null ? 100 : el.opacity) / 100;

    Object.assign(wrapper.style, {
      backgroundColor: el.backgroundColor || 'transparent',
      borderWidth: `${el.borderWidth || 0}px`,
      borderStyle: 'solid',
      borderColor: el.borderColor || '#000000',
      borderRadius: `${el.borderRadius || 0}px`,
      padding: '10px',
      boxSizing: 'border-box'
    });

    let innerHTML = '';
    switch (el.type) {
      case 'text': {
        Object.assign(wrapper.style, {
          fontFamily: el.fontFamily || 'Inter',
          fontSize: `${el.fontSize || 16}px`,
          color: el.color || '#000000',
          fontWeight: el.fontWeight || 'normal',
          fontStyle: el.fontStyle || 'normal',
          textDecoration: el.textDecoration || 'none'
        });
        innerHTML = el.content || '';
        break; }
      case 'image': {
        const radius = el.borderRadius == null ? 12 : Number(el.borderRadius);
        innerHTML = `<img src="${el.src || ''}" alt="" style="max-width:100%;height:auto;display:block;border-radius:${radius}px">`;
        break; }
      case 'video': {
        const radius = el.borderRadius == null ? 12 : Number(el.borderRadius);
        innerHTML = `<video src="${el.src || ''}" controls playsinline style="width:100%;border-radius:${radius}px"></video>`;
        break; }
      case 'button': {
        const txt = el.content || 'Button';
        const href = el.href || '#';
        const target = el.target || '_blank';
        const color = el.color || '#ffffff';
        const bg = el.backgroundColor || '#ef4444';
        wrapper.style.display = 'flex';
        wrapper.style.justifyContent = el.textAlign || 'center';
        innerHTML = `<a href="${href}" target="${target}" style="text-decoration:none;color:${color};background-color:${bg};padding:.7rem 1.5rem;font-weight:700;border-radius:.75rem;display:inline-block">${txt}</a>`;
        break; }
      case 'social': {
        const iconMap = { facebook:'facebook', instagram:'instagram', tiktok:'tiktok', youtube:'youtube', telegram:'telegram', whatsapp:'phone' };
        const icon = iconMap[el.platform] || 'message-circle';
        const url = el.url || '#';
        const size = el.size || 24;
        const color = el.color || '#374151';
        innerHTML = `<a class="social-icon" href="${url}" target="_blank" style="text-decoration:none;color:${color};display:inline-flex;align-items:center;gap:.5rem;font-size:${size}px"><i data-lucide="${icon}" class="w-6 h-6"></i></a>`;
        break; }
      case 'link': {
        const url = el.url || '#';
        const target = el.target || '_blank';
        const text = el.text || 'Link';
        innerHTML = `<a href="${url}" target="${target}" style="text-decoration:none;color:#374151;display:inline-block;font-weight:600">${text}</a>`;
        break; }
      default: {
        innerHTML = '';
      }
    }

    wrapper.innerHTML = innerHTML;
    return wrapper;
  }

  // --- API pengurusan bahagian/elemen ---
  function addSection(section) { pageSections.push(section); renderPage(); }
  function updateSection(id, properties) {
    const sec = pageSections.find(s => s.id === id);
    if (sec) { Object.assign(sec, properties); renderPage(); }
  }
  function deleteSection(id) {
    pageSections = pageSections.filter(s => s.id !== id);
    renderPage();
  }

  function addElement(sectionId, element) {
    const sec = pageSections.find(s => s.id === sectionId);
    if (sec) { (sec.elements = sec.elements || []).push(element); renderPage(); }
  }
  function updateElement(id, properties) {
    for (const sec of pageSections) {
      const el = (sec.elements || []).find(e => e.id === id);
      if (el) { Object.assign(el, properties); renderPage(); return; }
    }
  }
  function deleteElement(id) {
    for (const sec of pageSections) {
      const idx = (sec.elements || []).findIndex(e => e.id === id);
      if (idx > -1) { sec.elements.splice(idx, 1); renderPage(); return; }
    }
  }

  // Pilihan & mesej balik ke parent dashboard
  function makeSectionsSelectable() {
    document.querySelectorAll('.page-section').forEach(sec => {
      sec.addEventListener('click', (e) => {
        if (e.target.closest('.page-element')) return;
        e.stopPropagation();
        document.querySelectorAll('.page-section.selected').forEach(s => s.classList.remove('selected'));
        sec.classList.add('selected');
        window.parent.postMessage({ type: 'section-selected', data: { id: sec.dataset.id } }, '*');
      });
    });
  }

  function makeElementsSelectable() {
    document.querySelectorAll('.page-element').forEach(el => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.page-element.selected').forEach(elem => elem.classList.remove('selected'));
        el.classList.add('selected');
        window.parent.postMessage({ type: 'element-selected', data: { id: el.dataset.id } }, '*');
      });
    });
  }

  // Inisialisasi
  document.getElementById('year').textContent = new Date().getFullYear();

  (async function init() {
    try {
      const leader_id = new URLSearchParams(location.search).get('leader') || 'LEAD-0001';
      const response = await api('settings_get', { leader_id });

      if (response && response.success && response.settings && response.settings.sections_json) {
        try { pageSections = JSON.parse(response.settings.sections_json) || []; }
        catch { pageSections = []; }
      } else {
        // keadaan kosong: sediakan beberapa bahagian default asas untuk Free Users
        pageSections = [
          {
            id: 'hero',
            backgroundColor: '#ffffff',
            padding: '4rem 1rem',
            borderRadius: 0,
            elements: [
              { id: 'h1', type: 'text', sectionId: 'hero', gridColumn: 'span 12 / span 12', content: '<h1 style="font-size:2rem;font-weight:800;margin:0 0 .5rem">Selamat datang ke MOVA</h1><p class="muted" style="margin:0">Platform untuk pengguna percuma. Naik taraf bila-bila masa.</p>' },
              { id: 'cta', type: 'button', sectionId: 'hero', gridColumn: 'span 12 / span 12', content: 'Naik Taraf Sekarang', href: '#upgrade', backgroundColor: '#ef4444', color:'#ffffff' }
            ]
          }
        ];
      }

      renderPage();

      if (EDIT_MODE) {
        window.parent.postMessage({ type: 'sections-loaded', data: { sections: pageSections } }, '*');
      }
    } catch (error) {
      console.error('Gagal memuat data halaman:', error);
      toast('Gagal memuatkan kandungan halaman.');
      // fallback supaya UI tetap boleh dilihat
      pageSections = pageSections || [];
      renderPage();
    }
  })();
</script>
</body>
</html>
