<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MOVA • Leader Dashboard</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    :root{
      --mova-red:#e11934;
      --mova-red-600:#cc102a;
      --mova-red-700:#b30e25;
      --ink-900:#0f172a;
      --ink-700:#334155;
      --ink-600:#475569;
      --ink-300:#cbd5e1;
      --ink-200:#e2e8f0;
      --ink-100:#f8fafc;
      --white:#fff;
      --radius-xl:22px;
      --shadow-1:0 10px 25px rgba(16,24,40,.06), 0 4px 10px rgba(16,24,40,.04);
    }

    html,body{height:100%}
    body{
      margin:0;
      font-family:"Inter",sans-serif;
      color:var(--ink-900);
      background:linear-gradient(180deg,#fff,#fef2f2);
    }

    .topbar{
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(8px);
      border-bottom:1px solid var(--ink-200);
      position:sticky;top:0;z-index:10;
    }
    .topbar-inner{
      max-width:1200px;margin:0 auto;
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 22px;
    }
    .brand{display:flex;align-items:center;gap:10px}
    .badge{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#fff;border:1px solid var(--ink-200);box-shadow:var(--shadow-1);}
    .badge span{font-size:22px}
    .title{font-weight:800;font-size:17px}

    .btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;}
    .btn-red{background:linear-gradient(180deg,var(--mova-red),var(--mova-red-700));color:#fff}
    .btn-out{background:#fff;border:1px solid var(--ink-200);}

    main{max-width:1200px;margin:0 auto;padding:20px}

    .card{
      background:#fff;
      border-radius:var(--radius-xl);
      border:1px solid var(--ink-200);
      box-shadow:var(--shadow-1);
      margin-bottom:24px;
      overflow:hidden;
    }
    .card-head{padding:18px 20px;border-bottom:1px solid var(--ink-200);background:#fff5f5;font-weight:700;font-size:16px;}
    .card-body{padding:20px}

    #orgChart{
      width:100%;overflow-x:auto;overflow-y:hidden;
    }
    svg{width:100%;height:600px;}
    .node rect{
      rx:20;ry:20;
      stroke:#ccc;stroke-width:1.4;
      fill:#fff;
      filter:drop-shadow(0 2px 4px rgba(0,0,0,.08));
    }
    .node text{font-size:12.5px;text-anchor:middle;font-weight:600;fill:#1f2937;}
    .node .title{font-size:10.5px;fill:#64748b;}
    .link{fill:none;stroke:#cbd5e1;stroke-width:2px;}

    .btn-row{margin-top:16px;display:flex;gap:10px}
    .alert{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13px;}
    .ok{background:#ecfdf5;border:1px solid #bbf7d0;color:#065f46;}
    .err{background:#fff1f2;border:1px solid #fecdd3;color:#b91c1c;}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="badge"><span>🚀</span></div>
        <div>
          <div class="title">MOVA Leader Dashboard</div>
          <div style="font-size:13px;color:#64748b" id="welcome">Hai…</div>
        </div>
      </div>
      <div>
        <button class="btn-out" onclick="logout()">Log Keluar</button>
      </div>
    </div>
  </header>

  <main>
    <div class="card">
      <div class="card-head">Carta Organisasi</div>
      <div class="card-body">
        <div id="orgChart"></div>
        <div class="btn-row">
          <button class="btn btn-red" onclick="renderOrg()">Segar Semula Carta</button>
        </div>
        <div id="msg" class="alert"></div>
      </div>
    </div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbylAgFpv3cyZV7jPQFF8ROBB2nEIRTdF-Go6UtHQ4YN8KfAqGa914hTtiwmVeq0XtM/exec";

    const leaderName = localStorage.getItem("mova_leader_name") || "Leader";
    document.getElementById("welcome").textContent = `Hai, ${leaderName}`;

    function logout(){
      localStorage.clear();
      location.href="index.html";
    }

    // Contoh struktur organisasi
    const orgData = {
      name: "Amirul (Leader)",
      title: "Top Leader",
      color: "#facc15",
      children: [
        {
          name: "Azlan",
          title: "Gold Partner",
          color: "#84cc16",
          children: [
            { name: "Hakim", title: "Customer", color: "#fb7185" },
            { name: "Siti", title: "Customer", color: "#fb7185" },
            { name: "Farah", title: "Customer", color: "#fb7185" }
          ]
        },
        {
          name: "Syafiqah",
          title: "Gold Partner",
          color: "#facc15",
          children: [
            { name: "Aina", title: "Customer", color: "#fb7185" },
            { name: "Faiz", title: "Customer", color: "#fb7185" }
          ]
        },
        {
          name: "Zul",
          title: "Diamond Partner",
          color: "#a855f7",
          children: [
            { name: "Rafi", title: "Customer", color: "#fb7185" },
            { name: "Johan", title: "Customer", color: "#fb7185" }
          ]
        }
      ]
    };

    function renderOrg(){
      const container = document.getElementById("orgChart");
      container.innerHTML = "";
      const width = container.clientWidth;
      const height = 600;
      const svg = d3.select("#orgChart").append("svg")
        .attr("width", width)
        .attr("height", height);

      const g = svg.append("g").attr("transform", "translate(60,40)");

      const root = d3.hierarchy(orgData);
      const treeLayout = d3.tree().size([width - 150, height - 150]);
      treeLayout(root);

      // Links
      g.selectAll(".link")
        .data(root.links())
        .enter()
        .append("path")
        .attr("class", "link")
        .attr("d", d3.linkVertical()
          .x(d => d.x)
          .y(d => d.y)
        );

      // Nodes
      const node = g.selectAll(".node")
        .data(root.descendants())
        .enter()
        .append("g")
        .attr("class", "node")
        .attr("transform", d => `translate(${d.x},${d.y})`);

      node.append("rect")
        .attr("x", -55)
        .attr("y", -25)
        .attr("width", 110)
        .attr("height", 50)
        .attr("fill", d => d.data.color || "#fff");

      node.append("text")
        .attr("dy", "-3")
        .text(d => d.data.name);

      node.append("text")
        .attr("dy", "14")
        .attr("class", "title")
        .text(d => d.data.title);

      showMsg("Carta organisasi dimuat.", true);
    }

    function showMsg(txt, ok){
      const box=document.getElementById("msg");
      box.textContent=txt;
      box.className="alert "+(ok?"ok":"err");
      setTimeout(()=>box.textContent="",4000);
    }

    renderOrg();
  </script>
</body>
</html>
