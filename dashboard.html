
<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA Leader — Dashboard (Live Preview Clean)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --brand:#ef4444 }
    html,body{font-family:Inter,system-ui,ui-sans-serif;background:#fafafa}
    .btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:.75rem;padding:.7rem 1rem;font-weight:700}
    .btn-primary{background:var(--brand);color:#fff}
    .btn-ghost{background:#fff;border:1px solid #e5e7eb}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;box-shadow:0 6px 24px rgba(15,23,42,.06)}
    .tab{padding:.6rem 1rem;border-radius:.75rem}
    .tab.active{background:#111;color:#fff}
    .pill{display:inline-flex;align-items:center;gap:.4rem;background:#f3f4f6;padding:.25rem .6rem;border-radius:999px;font-size:12px}
    .toolbar button{border:1px solid #e5e7eb;border-radius:.5rem;padding:.25rem .5rem;background:#fff}
    .toolbar button:hover{background:#f3f4f6}
    .sidebar-btn{display:inline-flex;align-items:center;gap:.5rem;border:1px dashed #e5e7eb;border-radius:.75rem;padding:.5rem .85rem;background:#fff}
    .list-row{display:flex;align-items:center;justify-content:space-between;border:1px solid #eee;border-radius:.75rem;padding:.6rem .8rem;background:#fff}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#111;color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:9999}
    .input{width:100%;border:1px solid #d1d5db;border-radius:.75rem;padding:.6rem .8rem;background:#fff}
    .input:focus{outline:none;box-shadow:0 0 0 2px #111}
    .select{width:100%;border:1px solid #d1d5db;border-radius:.75rem;padding:.6rem .8rem;background:#fff}
  </style>
</head>
<body>
  <header class="bg-white border-b border-gray-200 sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="h-8 w-8 rounded-xl bg-[color:var(--brand)] text-white grid place-items-center">
          <i data-lucide="rocket" class="w-4 h-4"></i>
        </div>
        <div class="font-extrabold">MOVA Leader — Dashboard</div>
        <span id="lockPill" class="pill ml-3"><i data-lucide="lock" class="w-4 h-4"></i> Dikunci</span>
      </div>
      <div class="flex items-center gap-3">
        <button id="btnView" class="btn btn-ghost"><i data-lucide="external-link"></i>Lihat Laman User</button>
        <button id="btnSyncPreview" class="btn btn-ghost"><i data-lucide="refresh-ccw"></i>Sync Preview</button>
        <button id="btnSave" class="btn btn-primary"><i data-lucide="save"></i>Simpan</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <div class="flex items-center gap-2">
      <button data-tab="sections" class="tab active">User Sections</button>
      <button data-tab="settings" class="tab">Settings</button>
      <button data-tab="chart" class="tab">Carta</button>
      <button data-tab="broadcast" class="tab">Broadcast</button>
    </div>

    <div class="grid grid-cols-12 gap-6">
      <section class="col-span-12 lg:col-span-6 space-y-4" id="leftCol">
        <div data-panel="sections" class="card p-4 space-y-4">
          <div class="flex items-center justify-between">
            <h2 class="font-bold text-lg">Halaman User — Editor Bahagian</h2>
            <div class="flex items-center gap-2">
              <button id="btnUndo" class="sidebar-btn" title="Undo"><i data-lucide="undo-2" class="w-4 h-4"></i></button>
              <button id="btnRedo" class="sidebar-btn" title="Redo"><i data-lucide="redo-2" class="w-4 h-4"></i></button>
            </div>
          </div>

          <div class="flex gap-4">
            <div class="w-44 shrink-0 space-y-2">
              <button id="btnAddSection" class="sidebar-btn w-full"><i data-lucide="plus"></i> Tambah Seksyen</button>
              <div id="sectionList" class="space-y-2"></div>
            </div>

            <div class="flex-1 space-y-3">
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button class="sidebar-btn" data-add-el="text"><i data-lucide="type"></i>Teks</button>
                <button class="sidebar-btn" data-add-el="image"><i data-lucide="image"></i>Imej</button>
                <button class="sidebar-btn" data-add-el="video"><i data-lucide="video"></i>Video</button>
                <button class="sidebar-btn" data-add-el="button"><i data-lucide="link"></i>Butang/Pautan</button>
                <button class="sidebar-btn col-span-2" data-add-el="social"><i data-lucide="share-2"></i>Media Sosial</button>
              </div>

              <div id="editorPanel" class="hidden space-y-3">
                <div class="list-row">
                  <div class="font-semibold" id="currentSectionName">—</div>
                  <div class="flex items-center gap-2">
                    <button id="btnDeleteSection" class="sidebar-btn text-red-600"><i data-lucide="trash-2"></i>Padam</button>
                  </div>
                </div>

                <div class="space-y-3">
                  <label class="text-sm font-semibold">Nama Seksyen</label>
                  <input id="inpSectionTitle" class="input" placeholder="Contoh: Hero — MOVA"/>
                </div>

                <div class="space-y-3">
                  <label class="text-sm font-semibold">Elemen dalam Seksyen</label>
                  <div id="elementList" class="space-y-2"></div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div data-panel="settings" class="card p-4 space-y-4 hidden">
          <h2 class="font-bold text-lg">Settings</h2>
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="text-sm font-semibold">Fonnte API Key</label>
              <input id="inpFonnte" class="input" placeholder="Masukkan API key Fonnte"/>
            </div>
            <div>
              <label class="text-sm font-semibold">Nombor Telefon Leader</label>
              <input id="inpLeaderPhone" class="input" placeholder="Contoh: 60123456789"/>
            </div>
          </div>
        </div>

        <div data-panel="chart" class="card p-4 space-y-4 hidden">
          <h2 class="font-bold text-lg">Carta — Org Tree</h2>
          <textarea id="orgJson" class="input" rows="6" placeholder='{"name":"Saya","children":[{"name":"Partner A"},{"name":"Partner B"}]}'></textarea>
          <button id="btnRenderChart" class="btn btn-ghost"><i data-lucide="diagram-3"></i>Render</button>
          <div id="chartArea" class="mt-3 text-sm text-gray-600"></div>
        </div>

        <div data-panel="broadcast" class="card p-4 space-y-4 hidden">
          <h2 class="font-bold text-lg">Broadcast</h2>
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label class="text-sm font-semibold">Penerima (CSV nombor)</label>
              <textarea id="bcNumbers" class="input" rows="4" placeholder="6012...,6013..."></textarea>
            </div>
            <div>
              <label class="text-sm font-semibold">Jenis</label>
              <select id="bcType" class="select">
                <option value="text">Teks</option>
                <option value="image">Gambar</option>
                <option value="video">Video</option>
              </select>
              <label class="text-sm font-semibold mt-3 block">Mesej / URL Media</label>
              <textarea id="bcPayload" class="input" rows="4" placeholder="Teks mesej atau URL media"></textarea>
            </div>
          </div>
          <button id="btnExportCSV" class="btn btn-ghost"><i data-lucide="download"></i>Export CSV</button>
        </div>
      </section>

      <section class="col-span-12 lg:col-span-6">
        <div class="card p-4">
          <div class="flex items-center justify-between mb-2">
            <div class="font-semibold">Preview (Live, tiada simpan)</div>
            <div class="text-xs text-gray-500">user.html akan ikut selepas Simpan</div>
          </div>
          <iframe id="previewFrame" src="user.html?edit=1" class="w-full h-[70vh] bg-white rounded-xl border border-gray-200"></iframe>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script>
    const EXEC_URL = "https://script.google.com/macros/s/AKfycbylAgFpv3cyZV7jPQFF8ROBB2nEIRTdF-Go6UtHQ4YN8KfAqGa914hTtiwmVeq0XtM/exec";
    const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
    const $ = (sel,root=document)=>root.querySelector(sel);
    const toast = (msg,ms=1800)=>{ const el=$("#toast"); el.textContent=msg; el.classList.remove("hidden"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.add("hidden"),ms) };
    const store = { sections: [], settings: { fonnteKey:"", leaderPhone:"" }, history:[], future:[], selectedSectionId:null };

    async function api(path, payload) {
      const res = await fetch(EXEC_URL, {
        method: 'POST',
        headers: {'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
        body: new URLSearchParams({ path, payload: JSON.stringify(payload||{}) })
      });
      const text = await res.text();
      try{ const json=JSON.parse(text); if(json && json.success===false) throw new Error(json.error||"Ralat"); return json; }catch(e){ throw new Error(text) }
    }

    function pushHistory(){ store.history.push(JSON.stringify({sections:store.sections,settings:store.settings})); if(store.history.length>50) store.history.shift(); store.future.length=0 }
    function undo(){ if(!store.history.length) return; store.future.push(JSON.stringify({sections:store.sections,settings:store.settings})); const prev=JSON.parse(store.history.pop()); store.sections=prev.sections; store.settings=prev.settings; renderSidebar(); sendPreview() }
    function redo(){ if(!store.future.length) return; store.history.push(JSON.stringify({sections:store.sections,settings:store.settings})); const next=JSON.parse(store.future.pop()); store.sections=next.sections; store.settings=next.settings; renderSidebar(); sendPreview() }

    function newId(){ return "sec-"+Math.random().toString(36).slice(2,9) }
    function addSection(){ pushHistory(); const s={id:newId(), title:"Bahagian Baharu", elements:[], padding:"3rem 1rem", backgroundColor:"transparent"}; store.sections.push(s); store.selectedSectionId=s.id; renderSidebar(); openEditor(s.id); sendPreview() }
    function deleteSection(){ if(!store.selectedSectionId) return; pushHistory(); const i=store.sections.findIndex(x=>x.id===store.selectedSectionId); if(i>-1) store.sections.splice(i,1); store.selectedSectionId=null; renderSidebar(); $("#editorPanel").classList.add("hidden"); sendPreview() }
    function openEditor(id){ store.selectedSectionId=id; const s=store.sections.find(x=>x.id===id); if(!s) return; $("#editorPanel").classList.remove("hidden"); $("#currentSectionName").textContent=s.title||id; $("#inpSectionTitle").value=s.title||""; renderElementsList(s) }
    function renderSidebar(){ const list=$("#sectionList"); list.innerHTML=""; store.sections.forEach(s=>{ const row=document.createElement("div"); row.className="list-row cursor-pointer hover:bg-gray-50"; row.innerHTML=`<div class="truncate">${s.title||s.id}</div><div class="flex items-center gap-2"><button class="sidebar-btn" data-act="up"><i data-lucide="arrow-up"></i></button><button class="sidebar-btn" data-act="down"><i data-lucide="arrow-down"></i></button></div>`; row.addEventListener("click",(e)=>{ if(e.target.closest("[data-act]")) return; openEditor(s.id) }); row.querySelector('[data-act="up"]').addEventListener("click",(e)=>{ e.stopPropagation(); moveSection(s.id,-1) }); row.querySelector('[data-act="down"]').addEventListener("click",(e)=>{ e.stopPropagation(); moveSection(s.id,1) }); list.appendChild(row) }); if(window.lucide?.createIcons) lucide.createIcons() }
    function moveSection(id,dir){ pushHistory(); const i=store.sections.findIndex(s=>s.id===id), j=i+dir; if(i<0||j<0||j>=store.sections.length) return; const [sp]=store.sections.splice(i,1); store.sections.splice(j,0,sp); renderSidebar(); sendPreview() }
    function renderElementsList(sec){ const wrap=$("#elementList"); wrap.innerHTML=""; (sec.elements||[]).forEach(el=>{ const row=document.createElement("div"); row.className="list-row"; row.innerHTML=`<div class="text-sm">${el.type}</div><div class="flex items-center gap-2"><button class="sidebar-btn" data-mv="-1"><i data-lucide="arrow-up"></i></button><button class="sidebar-btn" data-mv="1"><i data-lucide="arrow-down"></i></button><button class="sidebar-btn text-red-600" data-del="1"><i data-lucide="trash-2"></i></button></div>`; row.querySelector("[data-del]").onclick=()=>{ pushHistory(); sec.elements=sec.elements.filter(x=>x!==el); renderElementsList(sec); sendPreview() }; row.querySelector("[data-mv]").onclick=(ev)=>{ pushHistory(); const dir=Number(ev.currentTarget.getAttribute("data-mv")); const i=sec.elements.indexOf(el); const j=i+dir; if(j<0||j>=sec.elements.length) return; const [sp]=sec.elements.splice(i,1); sec.elements.splice(j,0,sp); renderElementsList(sec); sendPreview() }; wrap.appendChild(row); const ed=document.createElement("div"); ed.className="grid grid-cols-2 gap-2 p-3 border rounded-xl"; ed.innerHTML=`
          <label class="text-xs col-span-2 font-semibold">Kandungan</label>
          ${el.type==="text" ? '<textarea class="input col-span-2" rows="3" data-k="content"></textarea>' : ''}
          ${el.type==="image" ? '<input class="input col-span-2" data-k="src" placeholder="URL imej"/>' : ''}
          ${el.type==="video" ? '<input class="input col-span-2" data-k="src" placeholder="URL video"/>' : ''}
          ${el.type==="button" ? '<input class="input" data-k="content" placeholder="Teks butang"/><input class="input" data-k="href" placeholder="URL"/>' : ''}
          ${el.type==="social" ? '<select class="select" data-k="platform"><option>facebook</option><option>instagram</option><option>telegram</option><option>whatsapp</option><option>tiktok</option><option>youtube</option></select><input class="input" data-k="url" placeholder="URL profil"/>' : ''}
          <label class="text-xs col-span-2 font-semibold">Grid</label>
          <select class="select" data-k="gridColumn">
            <option value="span 12 / span 12">Lebar penuh</option>
            <option value="span 6 / span 6">1/2</option>
            <option value="span 4 / span 4">1/3</option>
          </select>`;
        $$("[data-k]",ed).forEach(inp=>{ const k=inp.getAttribute("data-k"); inp.value = el[k] || (k==="gridColumn"?"span 12 / span 12":""); inp.oninput = ()=>{ pushHistory(); el[k]=inp.value; sendPreview(); }});
        wrap.appendChild(ed);
      }); if(window.lucide?.createIcons) lucide.createIcons() }

    $$("#leftCol [data-add-el]").forEach(b=> b.addEventListener("click", ()=>{
      const s=store.sections.find(x=>x.id===store.selectedSectionId); if(!s){ toast("Pilih seksyen dahulu"); return; } pushHistory();
      const base={ id:"el-"+Math.random().toString(36).slice(2,9), gridColumn:"span 12 / span 12" }; const t=b.getAttribute("data-add-el"); let el=null;
      if(t==="text") el={...base,type:"text",content:"Teks baharu"};
      if(t==="image") el={...base,type:"image",src:""};
      if(t==="video") el={...base,type:"video",src:""};
      if(t==="button") el={...base,type:"button",content:"Butang",href:"#"};
      if(t==="social") el={...base,type:"social",platform:"facebook",url:"#"};
      (s.elements ||= []).push(el); renderElementsList(s); sendPreview();
    }));

    $("#btnAddSection").onclick=addSection;
    $("#btnDeleteSection").onclick=deleteSection;
    $("#inpSectionTitle").oninput=()=>{ const s=store.sections.find(x=>x.id===store.selectedSectionId); if(!s) return; pushHistory(); s.title=$("#inpSectionTitle").value; renderSidebar(); sendPreview() };
    $("#btnUndo").onclick=undo; $("#btnRedo").onclick=redo;

    $$("[data-tab]").forEach(t=> t.addEventListener("click",()=>{
      $$("[data-tab]").forEach(x=>x.classList.remove("active")); t.classList.add("active");
      const key=t.getAttribute("data-tab"); $$("[data-panel]").forEach(p=> p.classList.toggle("hidden", p.getAttribute("data-panel")!==key));
    }));

    const iframe = $("#previewFrame");
    function sendPreview(selectedId=null){
      localStorage.setItem('mova_preview_bootstrap', JSON.stringify({ sections: store.sections, settings: store.settings }));
      iframe?.contentWindow?.postMessage({ type:"sections-live-update", sections: store.sections, settings: store.settings, selectedId },"*");
    }
    window.addEventListener("message",(e)=>{ if((e.data||{}).type==="mova-bridge-ready") sendPreview(store.selectedSectionId) });
    iframe.addEventListener("load", ()=>{ try{ iframe.contentWindow.postMessage({type:"mova-bridge-ping"},"*") }catch(e){} });

    async function bootstrap(){
      try{
        const leader_id="LEAD-0001";
        const res=await api("settings_get",{leader_id});
        const settings=res?.settings||{};
        store.settings.fonnteKey=settings.fonnteKey||settings.fonnte_key||"";
        store.settings.leaderPhone=settings.leaderPhone||settings.leader_phone||"";
        const raw=settings.sections_json ?? settings.sections ?? [];
        store.sections=Array.isArray(raw)?raw:(typeof raw==="string"?JSON.parse(raw||"[]"):[]);
      }catch(e){
        try{ const raw=JSON.parse(localStorage.getItem("mova_preview_bootstrap")||"{}"); store.sections=raw.sections||[]; store.settings=Object.assign(store.settings, raw.settings||{}) }catch(_){}
      }
      $("#inpFonnte").value=store.settings.fonnteKey||"";
      $("#inpLeaderPhone").value=store.settings.leaderPhone||"";
      renderSidebar(); if(store.sections[0]) openEditor(store.sections[0].id); sendPreview();
    }
    $("#inpFonnte").oninput=()=>{ pushHistory(); store.settings.fonnteKey=$("#inpFonnte").value; sendPreview() };
    $("#inpLeaderPhone").oninput=()=>{ pushHistory(); store.settings.leaderPhone=$("#inpLeaderPhone").value; sendPreview() };
    $("#btnSave").onclick=async()=>{ try{ const leader_id="LEAD-0001"; const payload={leader_id, settings:{ fonnteKey:store.settings.fonnteKey||"", leaderPhone:store.settings.leaderPhone||"", sections_json:store.sections }}; await api("settings_update", payload); toast("Reka bentuk disimpan") }catch(e){ console.error(e); toast("Gagal simpan") } };
    $("#btnSyncPreview").onclick=()=> sendPreview(store.selectedSectionId);
    $("#btnView").onclick=()=> window.open("user.html","_blank");

    $("#btnRenderChart").onclick = ()=>{ try{ const data=JSON.parse($("#orgJson").value||"{}"); $("#chartArea").textContent=JSON.stringify(data,null,2) }catch(e){ $("#chartArea").textContent="JSON tidak sah" } };
    $("#btnExportCSV").onclick = ()=>{ const rows=($("#bcNumbers").value||"").split(/[,\n\s]+/).filter(Boolean).map(n=>[n]); let csv="phone\n"+rows.map(r=>r.join(",")).join("\n"); const blob=new Blob([csv],{type:"text/csv"}); const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="broadcast_numbers.csv"; a.click(); URL.revokeObjectURL(url) };

    document.addEventListener("DOMContentLoaded", ()=>{ if(window.lucide?.createIcons) lucide.createIcons(); bootstrap() });
  </script>
</body>
</html>
