
<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA Leader — Dashboard</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js for Carta tab -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root { --brand:#ef4444; }
    html,body{font-family:Inter,system-ui,ui-sans-serif,Segoe UI,Roboto,Helvetica,Arial;background:#fafafa}
    .container{max-width:1200px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;box-shadow:0 6px 24px rgba(15,23,42,.06)}
    .btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:.75rem;padding:.7rem 1rem;font-weight:700}
    .btn-primary{background:var(--brand);color:#fff}
    .btn-ghost{background:#fff;border:1px solid #e5e7eb}
    .pill{display:inline-flex;align-items:center;gap:.5rem;border-radius:9999px;padding:.35rem .75rem;border:1px solid #e5e7eb;background:#fff}
    .scroll-x{overflow-x:auto}
    .mini-preview{border:1px dashed #e5e7eb;border-radius:1rem;background:#fff}
    .tab-btn{padding:.65rem 1rem;border-radius:.75rem;font-weight:600}
    .tab-btn.active{background:#111827;color:#fff}
    .input{border:1px solid #e5e7eb;border-radius:.75rem;padding:.65rem .9rem}
    .label{font-size:.875rem;color:#6b7280}
  </style>
</head>

<body class="min-h-screen">
  <!-- Topbar -->
  <header class="bg-white border-b border-gray-200">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-[var(--brand)] text-white grid place-items-center font-extrabold">M</div>
        <div>
          <div class="text-xl font-extrabold tracking-tight">MOVA Leader</div>
          <div class="text-xs text-gray-500">Dashboard</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnRefresh" class="btn btn-ghost"><i data-lucide="refresh-ccw" class="w-4 h-4"></i> Segar semula</button>
        <div class="pill"><i data-lucide="user" class="w-4 h-4"></i><span id="whoami">Leader</span></div>
      </div>
    </div>
  </header>

  <!-- Tabs -->
  <main class="container mx-auto px-4 py-6">
    <div class="flex flex-wrap gap-2 mb-6">
      <button data-tab="tab-sections" class="tab-btn active">User Sections</button>
      <button data-tab="tab-kandungan" class="tab-btn">Kandungan</button>
      <button data-tab="tab-media" class="tab-btn">Media</button>
      <button data-tab="tab-partner" class="tab-btn">Partner</button>
      <button data-tab="tab-customer" class="tab-btn">Customer</button>
      <button data-tab="tab-approvals" class="tab-btn">Approvals</button>
      <button data-tab="tab-broadcast" class="tab-btn">Broadcast (Log)</button>
      <button data-tab="tab-carta" class="tab-btn">Carta</button>
      <button data-tab="tab-settings" class="tab-btn">Settings</button>
    </div>

    <!-- User Sections -->
    <section id="tab-sections" class="space-y-6">
      <div class="grid md:grid-cols-2 gap-6">
        <!-- Builder -->
        <div class="card p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold">Builder</h2>
            <div class="flex gap-2">
              <button id="btnAddText" class="btn btn-ghost"><i data-lucide="type" class="w-4 h-4"></i> Teks</button>
              <button id="btnAddImage" class="btn btn-ghost"><i data-lucide="image" class="w-4 h-4"></i> Imej</button>
              <button id="btnAddVideo" class="btn btn-ghost"><i data-lucide="video" class="w-4 h-4"></i> Video</button>
              <button id="btnAddLink" class="btn btn-ghost"><i data-lucide="link" class="w-4 h-4"></i> Pautan</button>
              <button id="btnAddButton" class="btn btn-ghost"><i data-lucide="square" class="w-4 h-4"></i> Butang</button>
            </div>
          </div>

          <div id="blocks" class="space-y-4"></div>

          <div class="flex items-center gap-3 mt-4">
            <button id="btnSaveSections" class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i> Simpan</button>
            <button id="btnClearSections" class="btn btn-ghost"><i data-lucide="eraser" class="w-4 h-4"></i> Kosongkan</button>
          </div>
        </div>

        <!-- Mini Preview -->
        <div class="card p-4">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold">Mini Preview</h2>
            <div class="pill"><span class="label">Lebar</span><span id="contentWidthLabel" class="font-semibold ml-1">800px</span></div>
          </div>
          <div id="miniPreview" class="mini-preview p-4">
            <div id="previewInner" class="mx-auto" style="max-width:800px"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Kandungan -->
    <section id="tab-kandungan" class="hidden">
      <div class="card p-4 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold">Senarai Kandungan</h2>
          <div class="flex gap-2">
            <button id="btnContentRefresh" class="btn btn-ghost"><i data-lucide="refresh-ccw" class="w-4 h-4"></i> Segar semula</button>
          </div>
        </div>
        <div id="contentList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </section>

    <!-- Media -->
    <section id="tab-media" class="hidden">
      <div class="grid md:grid-cols-3 gap-6">
        <div class="card p-4 space-y-3 md:col-span-1">
          <h2 class="text-lg font-bold">Muat Naik Media</h2>
          <label class="label">Pilih Fail</label>
          <input id="mediaFile" type="file" class="input w-full" accept="image/*,video/*"/>
          <label class="label">Keterangan (optional)</label>
          <input id="mediaNote" class="input w-full" placeholder="Nota…"/>
          <button id="btnUploadMedia" class="btn btn-primary mt-2"><i data-lucide="upload" class="w-4 h-4"></i> Muat naik</button>
        </div>
        <div class="card p-4 md:col-span-2">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-lg font-bold">Senarai Media</h2>
            <button id="btnMediaRefresh" class="btn btn-ghost"><i data-lucide="refresh-ccw" class="w-4 h-4"></i> Segar semula</button>
          </div>
          <div id="mediaList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
      </div>
    </section>

    <!-- Partner -->
    <section id="tab-partner" class="hidden">
      <div class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-bold">Rangkaian Partner</h2>
          <button id="btnPartnerRefresh" class="btn btn-ghost"><i data-lucide="refresh-ccw" class="w-4 h-4"></i> Segar semula</button>
        </div>
        <div id="partnerList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </section>

    <!-- Customer -->
    <section id="tab-customer" class="hidden">
      <div class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-bold">Senarai Customer</h2>
          <button id="btnCustomerRefresh" class="btn btn-ghost"><i data-lucide="refresh-ccw" class="w-4 h-4"></i> Segar semula</button>
        </div>
        <div id="customerList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </section>

    <!-- Approvals -->
    <section id="tab-approvals" class="hidden">
      <div class="card p-4">
        <div class="flex items-center justify-between mb-3">
          <h2 class="text-lg font-bold">Approvals</h2>
          <button id="btnApprovalsRefresh" class="btn btn-ghost"><i data-lucide="refresh-ccw" class="w-4 h-4"></i> Segar semula</button>
        </div>
        <div id="approvalsList" class="space-y-3"></div>
      </div>
    </section>

    <!-- Broadcast (Log sahaja) -->
    <section id="tab-broadcast" class="hidden">
      <div class="card p-4 space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-lg font-bold">Broadcast Log</h2>
          <div class="flex gap-2">
            <button id="btnExportCSV" class="btn btn-ghost"><i data-lucide="download" class="w-4 h-4"></i> Eksport CSV</button>
            <button id="btnClearLog" class="btn btn-ghost"><i data-lucide="trash-2" class="w-4 h-4"></i> Kosongkan Log</button>
          </div>
        </div>
        <div class="scroll-x">
          <table class="min-w-[700px] w-full text-sm">
            <thead>
              <tr class="text-left text-gray-500">
                <th class="py-2">Tarikh</th>
                <th>Jenis</th>
                <th>Tujuan</th>
                <th>Status</th>
                <th>Butiran</th>
              </tr>
            </thead>
            <tbody id="broadcastLog"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Carta -->
    <section id="tab-carta" class="hidden">
      <div class="grid md:grid-cols-2 gap-6">
        <div class="card p-4">
          <h2 class="text-lg font-bold mb-3">Pendaftaran 30 Hari</h2>
          <canvas id="chart1" height="140"></canvas>
        </div>
        <div class="card p-4">
          <h2 class="text-lg font-bold mb-3">Aktiviti Broadcast</h2>
          <canvas id="chart2" height="140"></canvas>
        </div>
      </div>
    </section>

    <!-- Settings -->
    <section id="tab-settings" class="hidden">
      <div class="card p-4 space-y-4">
        <h2 class="text-lg font-bold">Tetapan</h2>
        <div class="grid md:grid-cols-3 gap-4">
          <div>
            <label class="label">WhatsApp (Fonnte) Token</label>
            <input id="setWhatsapp" class="input w-full" placeholder="token…"/>
          </div>
          <div>
            <label class="label">Content Width (px)</label>
            <input id="setContentWidth" type="number" class="input w-full" value="800" min="480" max="1200"/>
          </div>
          <div>
            <label class="label">Font Heading</label>
            <select id="setHeadingFont" class="input w-full">
              <option>Playfair Display</option>
              <option>Inter</option>
              <option>Poppins</option>
            </select>
          </div>
          <div>
            <label class="label">Font Body</label>
            <select id="setBodyFont" class="input w-full">
              <option>Inter</option>
              <option>Poppins</option>
            </select>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <button id="btnSaveSettings" class="btn btn-primary"><i data-lucide="save" class="w-4 h-4"></i> Simpan Tetapan</button>
          <div id="settingsSaved" class="text-sm text-green-600 hidden">Disimpan!</div>
        </div>
      </div>
    </section>
  </main>

  <script>
  // =====================
  //  CONFIG / CONSTANTS
  // =====================
  const EXEC_URL = 'https://script.google.com/macros/s/AKfycbylAgFpv3cyZV7jPQFF8ROBB2nEIRTdF-Go6UtHQ4YN8KfAqGa914hTtiwmVeq0XtM/exec'; // TODO: ganti dengan EXEC_URL sebenar anda
  const API_TIMEOUT = 20000;

  // =====================
  //  UTILITIES & GUARDS
  // =====================
  const $ = (sel, el=document) => el.querySelector(sel);
  const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));

  // Avoid multiple bindings
  const BOUND = new WeakSet();
  function bindOnce(el, evt, handler, opts){ if(!BOUND.has(handler)){ el.addEventListener(evt, handler, opts||{}); BOUND.add(handler);} }

  // Debounce
  function debounce(fn, ms){ let t; return (...args)=>{ clearTimeout(t); t=setTimeout(()=>fn(...args), ms); }; }

  // Mutex for idempotent ops
  class Mutex{ constructor(){ this.locked=false; } async run(fn){ if(this.locked) return; this.locked=true; try{ return await fn(); } finally{ this.locked=false; } } }
  const saveMutex = new Mutex();

  // Helpers
  function toastOK(msg){ console.log('OK:', msg); }
  function toastErr(e){ console.error('ERR:', e); alert(e?.message||'Ralat'); }

  // Form-encoded Apps Script POST
  async function gsPost(path, payload){
    const body = new URLSearchParams();
    body.append('path', path);
    body.append('payload', JSON.stringify(payload||{}));
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), API_TIMEOUT);
    try{
      const res = await fetch(EXEC_URL, { method:'POST', body, signal:ctrl.signal });
      if(!res.ok) throw new Error('HTTP '+res.status);
      return await res.json();
    } finally { clearTimeout(t); }
  }

  // =====================
  //  TABS
  // =====================
  const tabs = $$('.tab-btn');
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.getAttribute('data-tab');
      $$('main section').forEach(sec=>sec.classList.add('hidden'));
      $('#'+target).classList.remove('hidden');
    });
  });

  // =====================
  //  SETTINGS
  // =====================
  async function loadSettings(){
    try{
      const { data } = await gsPost('settings_get', {});
      if(data){
        $('#setWhatsapp').value = data.whatsapp||'';
        $('#setContentWidth').value = data.content_width||800;
        $('#setHeadingFont').value = data.heading_font||'Playfair Display';
        $('#setBodyFont').value = data.body_font||'Inter';
        applyContentWidth();
      }
    }catch(e){ /* first run may not have settings */ }
  }
  function applyContentWidth(){
    const w = parseInt($('#setContentWidth').value||800,10);
    $('#contentWidthLabel').textContent = w+'px';
    $('#previewInner').style.maxWidth = w+'px';
  }
  bindOnce($('#setContentWidth'), 'input', debounce(applyContentWidth, 150));

  bindOnce($('#btnSaveSettings'), 'click', async ()=>{
    try{
      await gsPost('settings_update', {
        whatsapp: $('#setWhatsapp').value.trim(),
        content_width: parseInt($('#setContentWidth').value||800,10),
        heading_font: $('#setHeadingFont').value,
        body_font: $('#setBodyFont').value
      });
      $('#settingsSaved').classList.remove('hidden');
      setTimeout(()=>$('#settingsSaved').classList.add('hidden'), 1500);
      applyContentWidth();
      toastOK('Tetapan disimpan');
    }catch(e){ toastErr(e); }
  });

  // =====================
  //  SECTIONS BUILDER
  // =====================
  let blocks = []; // array of {type, data:{}}

  function renderBlocks(){
    const wrap = $('#blocks');
    wrap.innerHTML = '';
    blocks.forEach((b, idx)=>{
      const row = document.createElement('div');
      row.className = 'border border-gray-200 rounded-xl p-3 space-y-3';
      row.innerHTML = getBlockEditorHTML(b, idx);
      wrap.appendChild(row);

      // bind controls
      const up = row.querySelector('[data-cmd="up"]');
      const down = row.querySelector('[data-cmd="down"]');
      const del = row.querySelector('[data-cmd="del"]');
      up.onclick = ()=>{ if(idx>0){ [blocks[idx-1], blocks[idx]] = [blocks[idx], blocks[idx-1]]; renderBlocks(); renderPreview(); } };
      down.onclick = ()=>{ if(idx<blocks.length-1){ [blocks[idx+1], blocks[idx]] = [blocks[idx], blocks[idx+1]]; renderBlocks(); renderPreview(); } };
      del.onclick = ()=>{ blocks.splice(idx,1); renderBlocks(); renderPreview(); };

      // value bindings
      $$('.val', row).forEach(inp=>{
        inp.addEventListener('input', debounce(()=>{
          const key = inp.getAttribute('data-key');
          if(b.type==='text'){
            b.data[key]=inp.value;
          }else if(b.type==='image'){
            b.data[key]=inp.value;
          }else if(b.type==='video'){
            b.data[key]=inp.value;
          }else if(b.type==='link' || b.type==='button'){
            b.data[key]=inp.value;
          }
          renderPreview();
        }, 120));
      });
    });
  }

  function getBlockEditorHTML(b, idx){
    const controls = `
      <div class="flex items-center justify-between">
        <div class="pill"><span class="text-xs text-gray-500">#${idx+1}</span><span class="font-semibold">${b.type.toUpperCase()}</span></div>
        <div class="flex gap-2">
          <button class="btn btn-ghost" data-cmd="up"><i data-lucide="arrow-up" class="w-4 h-4"></i></button>
          <button class="btn btn-ghost" data-cmd="down"><i data-lucide="arrow-down" class="w-4 h-4"></i></button>
          <button class="btn btn-ghost" data-cmd="del"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        </div>
      </div>
    `;
    if(b.type==='text'){
      return controls + `
        <div class="grid md:grid-cols-2 gap-3">
          <div><label class="label">Heading</label><input class="input w-full val" data-key="heading" value="${b.data.heading||''}" placeholder="Tajuk…"></div>
          <div><label class="label">Saiz Heading (px)</label><input class="input w-full val" data-key="hSize" type="number" value="${b.data.hSize||28}"></div>
          <div class="md:col-span-2"><label class="label">Body</label><textarea class="input w-full val" data-key="body" rows="4" placeholder="Perenggan…">${b.data.body||''}</textarea></div>
          <div><label class="label">Saiz Body (px)</label><input class="input w-full val" data-key="bSize" type="number" value="${b.data.bSize||16}"></div>
          <div><label class="label">Warna Teks</label><input class="input w-full val" data-key="color" type="color" value="${b.data.color||'#111827'}"></div>
          <div><label class="label">Bold?</label>
            <select class="input w-full val" data-key="bold"><option ${b.data.bold?'':'selected'} value="">Tidak</option><option ${b.data.bold?'selected':''} value="1">Ya</option></select>
          </div>
        </div>`;
    }
    if(b.type==='image'){
      return controls + `
        <div class="grid md:grid-cols-2 gap-3">
          <div><label class="label">URL Gambar</label><input class="input w-full val" data-key="src" value="${b.data.src||''}" placeholder="https://…"></div>
          <div><label class="label">Alt</label><input class="input w-full val" data-key="alt" value="${b.data.alt||''}" placeholder="Alt…"></div>
          <div><label class="label">Lebar (px)</label><input class="input w-full val" data-key="w" type="number" value="${b.data.w||800}"></div>
          <div><label class="label">Radius (px)</label><input class="input w-full val" data-key="radius" type="number" value="${b.data.radius||16}"></div>
        </div>`;
    }
    if(b.type==='video'){
      return controls + `
        <div class="grid md:grid-cols-2 gap-3">
          <div><label class="label">URL Video (YouTube/mp4)</label><input class="input w-full val" data-key="src" value="${b.data.src||''}" placeholder="https://…"></div>
          <div><label class="label">Tinggi (px)</label><input class="input w-full val" data-key="h" type="number" value="${b.data.h||360}"></div>
        </div>`;
    }
    if(b.type==='link' || b.type==='button'){
      return controls + `
        <div class="grid md:grid-cols-2 gap-3">
          <div><label class="label">Teks</label><input class="input w-full val" data-key="text" value="${b.data.text||''}" placeholder="Teks…"></div>
          <div><label class="label">URL</label><input class="input w-full val" data-key="href" value="${b.data.href||''}" placeholder="https://…"></div>
        </div>`;
    }
    return controls;
  }

  function renderPreview(){
    const root = $('#previewInner');
    root.innerHTML = blocks.map(b=>{
      if(b.type==='text'){
        const wBold = b.data.bold ? 'font-extrabold' : 'font-semibold';
        const heading = b.data.heading ? `<h3 class="font-['Playfair Display'] ${wBold}" style="font-size:${parseInt(b.data.hSize||28,10)}px;color:${b.data.color||'#111827'}">${b.data.heading||''}</h3>` : '';
        const body = b.data.body ? `<p style="font-size:${parseInt(b.data.bSize||16,10)}px;color:${b.data.color||'#111827'}" class="mt-2">${(b.data.body||'').replace(/\n/g,'<br/>')}</p>` : '';
        return `<div class="py-3">${heading}${body}</div>`;
      }
      if(b.type==='image'){
        const w = parseInt(b.data.w||800,10);
        const r = parseInt(b.data.radius||16,10);
        return `<div class="py-3"><img src="${b.data.src||''}" alt="${b.data.alt||''}" style="max-width:100%;width:${w}px;border-radius:${r}px"/></div>`;
      }
      if(b.type==='video'){
        const h = parseInt(b.data.h||360,10);
        const src = b.data.src||'';
        const yt = src.includes('youtube.com') || src.includes('youtu.be');
        if(yt){
          const embed = src
            .replace('watch?v=','embed/')
            .replace('youtu.be/','youtube.com/embed/');
          return `<div class="py-3"><div class="relative w-full" style="padding-top:${(h/ (16/9))}px"><iframe src="${embed}" class="absolute inset-0 w-full h-full rounded-xl" frameborder="0" allowfullscreen></iframe></div></div>`;
        }
        return `<div class="py-3"><video src="${src}" controls class="w-full rounded-xl" style="height:${h}px"></video></div>`;
      }
      if(b.type==='link'){
        return `<div class="py-3"><a href="${b.data.href||'#'}" class="text-[var(--brand)] underline" target="_blank" rel="noopener">${b.data.text||'Pautan'}</a></div>`;
      }
      if(b.type==='button'){
        return `<div class="py-3"><a href="${b.data.href||'#'}" class="btn btn-primary" target="_blank" rel="noopener">${b.data.text||'Butang'}</a></div>`;
      }
      return '';
    }).join('');
  }

  function addBlock(type){
    const defaults = {
      text: { heading:'', hSize:28, body:'', bSize:16, color:'#111827', bold:false },
      image: { src:'', alt:'', w:800, radius:16 },
      video: { src:'', h:360 },
      link: { text:'Pautan', href:'' },
      button: { text:'Butang', href:'' }
    };
    blocks.push({ type, data: JSON.parse(JSON.stringify(defaults[type])) });
    renderBlocks(); renderPreview();
  }

  bindOnce($('#btnAddText'),'click',()=>addBlock('text'));
  bindOnce($('#btnAddImage'),'click',()=>addBlock('image'));
  bindOnce($('#btnAddVideo'),'click',()=>addBlock('video'));
  bindOnce($('#btnAddLink'),'click',()=>addBlock('link'));
  bindOnce($('#btnAddButton'),'click',()=>addBlock('button'));

  bindOnce($('#btnClearSections'),'click',()=>{ if(confirm('Kosongkan semua blok?')){ blocks=[]; renderBlocks(); renderPreview(); } });

  bindOnce($('#btnSaveSections'),'click', ()=> saveMutex.run(async ()=>{
    try{
      await gsPost('content_save', { key:'user_sections', value: blocks });
      toastOK('Disimpan');
    }catch(e){ toastErr(e); }
  }));

  async function loadSections(){
    try{
      const { data } = await gsPost('content_list', { key:'user_sections' });
      if (data && Array.isArray(data.value)) {
        blocks = data.value;
        renderBlocks(); renderPreview();
      }
    }catch(e){ /* ignore if first run */ }
  }

  // =====================
  //  KANDUNGAN
  // =====================
  async function refreshContent(){
    try{
      const { data } = await gsPost('content_list', { all:true });
      const list = $('#contentList'); list.innerHTML = '';
      (data||[]).forEach(item=>{
        const card = document.createElement('div');
        card.className = 'card p-3';
        card.innerHTML = `
          <div class="text-sm text-gray-500">${item.key||'-'}</div>
          <pre class="text-xs bg-gray-50 p-2 rounded mt-2 overflow-auto">${JSON.stringify(item.value,null,2)}</pre>
        `;
        list.appendChild(card);
      });
    }catch(e){ toastErr(e); }
  }
  bindOnce($('#btnContentRefresh'),'click',refreshContent);

  // =====================
  //  MEDIA
  // =====================
  bindOnce($('#btnUploadMedia'),'click', async ()=>{
    const f = $('#mediaFile').files[0];
    if(!f){ alert('Pilih fail terlebih dahulu'); return; }
    try{
      const b64 = await fileToBase64(f);
      await gsPost('upload_media', { filename:f.name, mimetype:f.type, data:b64, note: $('#mediaNote').value||'' });
      $('#mediaFile').value=''; $('#mediaNote').value='';
      await refreshMedia();
      toastOK('Muat naik berjaya');
    }catch(e){ toastErr(e); }
  });
  function fileToBase64(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(file); }); }

  async function refreshMedia(){
    try{
      const { data } = await gsPost('media_list', {});
      const wrap = $('#mediaList'); wrap.innerHTML='';
      (data||[]).forEach(m=>{
        const d = document.createElement('div');
        d.className = 'card p-3';
        const isImg = (m.mimetype||'').startsWith('image/');
        d.innerHTML = `
          <div class="text-sm font-semibold">${m.filename||'-'}</div>
          <div class="text-xs text-gray-500">${m.mimetype||''}</div>
          <div class="mt-2">${isImg?`<img src="${m.url||'#'}" class="w-full rounded-lg">`:`<video src="${m.url||'#'}" class="w-full rounded-lg" controls></video>`}</div>
          <div class="text-xs text-gray-500 mt-2">${m.note||''}</div>
        `;
        wrap.appendChild(d);
      });
    }catch(e){ toastErr(e); }
  }
  bindOnce($('#btnMediaRefresh'),'click',refreshMedia);

  // =====================
  //  PARTNER
  // =====================
  async function refreshPartner(){
    try{
      const { data } = await gsPost('partner_list', {});
      const wrap = $('#partnerList'); wrap.innerHTML='';
      (data||[]).forEach(p=>{
        const c = document.createElement('div');
        c.className = 'card p-3';
        c.innerHTML = `
          <div class="flex items-center justify-between">
            <div>
              <div class="font-semibold">${p.name||'-'}</div>
              <div class="text-xs text-gray-500">${p.package||'-'}</div>
            </div>
            <div class="pill">${p.status||'active'}</div>
          </div>
        `;
        wrap.appendChild(c);
      });
    }catch(e){ toastErr(e); }
  }
  bindOnce($('#btnPartnerRefresh'),'click',refreshPartner);

  // =====================
  //  CUSTOMER
  // =====================
  async function refreshCustomer(){
    try{
      const { data } = await gsPost('customer_list', {});
      const wrap = $('#customerList'); wrap.innerHTML='';
      (data||[]).forEach(cu=>{
        const c = document.createElement('div');
        c.className = 'card p-3';
        c.innerHTML = `
          <div class="font-semibold">${cu.name||'-'}</div>
          <div class="text-xs text-gray-500">${cu.phone||'-'}</div>
        `;
        wrap.appendChild(c);
      });
    }catch(e){ /* may be optional */ }
  }
  bindOnce($('#btnCustomerRefresh'),'click',refreshCustomer);

  // =====================
  //  APPROVALS
  // =====================
  async function refreshApprovals(){
    try{
      const { data } = await gsPost('registration_list', {});
      const wrap = $('#approvalsList'); wrap.innerHTML='';
      (data||[]).forEach(r=>{
        const row = document.createElement('div');
        row.className = 'border border-gray-200 rounded-xl p-3 flex items-center justify-between';
        row.innerHTML = `
          <div>
            <div class="font-semibold">${r.name||'-'}</div>
            <div class="text-xs text-gray-500">${r.phone||'-'} · ${r.package||'-'}</div>
          </div>
          <div class="flex gap-2">
            <button class="btn btn-ghost act-approve"><i data-lucide="check" class="w-4 h-4"></i> Lulus</button>
            <button class="btn btn-ghost act-reject"><i data-lucide="x" class="w-4 h-4"></i> Tolak</button>
          </div>
        `;
        row.querySelector('.act-approve').onclick = async ()=>{
          try{ await gsPost('registration_approve', { id:r.id, ok:true }); row.remove(); }catch(e){ toastErr(e); }
        };
        row.querySelector('.act-reject').onclick = async ()=>{
          try{ await gsPost('registration_approve', { id:r.id, ok:false }); row.remove(); }catch(e){ toastErr(e); }
        };
        wrap.appendChild(row);
      });
    }catch(e){ toastErr(e); }
  }
  bindOnce($('#btnApprovalsRefresh'),'click',refreshApprovals);

  // =====================
  //  BROADCAST (LOG)
  // =====================
  const LOG_KEY = 'broadcast_log';
  function getLog(){ try{ return JSON.parse(localStorage.getItem(LOG_KEY)||'[]'); }catch(_){ return []; } }
  function setLog(v){ localStorage.setItem(LOG_KEY, JSON.stringify(v||[])); }
  function renderLog(){
    const rows = getLog().map(x=>`
      <tr class="border-t">
        <td class="py-2">${x.ts||'-'}</td>
        <td>${x.kind||'-'}</td>
        <td>${x.to||'-'}</td>
        <td>${x.status||'-'}</td>
        <td>${x.note||''}</td>
      </tr>
    `).join('');
    $('#broadcastLog').innerHTML = rows || '<tr><td colspan="5" class="py-3 text-center text-gray-400">Tiada log</td></tr>';
  }
  bindOnce($('#btnExportCSV'),'click',()=>{
    const arr = getLog();
    const csv = ['tarikh,jenis,tujuan,status,butiran'].concat(
      arr.map(x=>[x.ts,x.kind,x.to,x.status,(x.note||'').replace(/,/g,';')].join(','))
    ).join('\n');
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='broadcast_log.csv'; a.click();
    URL.revokeObjectURL(url);
  });
  bindOnce($('#btnClearLog'),'click',()=>{ if(confirm('Kosongkan log?')){ setLog([]); renderLog(); } });

  // =====================
  //  CHARTS
  // =====================
  function initCharts(){
    const c1 = new Chart($('#chart1'), {
      type:'line',
      data:{ labels:Array.from({length:30},(_,i)=>'D'+(i+1)),
        datasets:[{ label:'Daftar', data:Array.from({length:30},()=>Math.floor(Math.random()*8)+1) }]},
      options:{ responsive:true, maintainAspectRatio:false }
    });
    const c2 = new Chart($('#chart2'), {
      type:'bar',
      data:{ labels:['Hantar','Berjaya','Gagal'], datasets:[{ label:'Minggu ini', data:[30,25,5] }]},
      options:{ responsive:true, maintainAspectRatio:false }
    });
  }

  // =====================
  //  BOOT
  // =====================
  bindOnce($('#btnRefresh'),'click', async ()=>{
    await loadSettings(); applyContentWidth();
    await loadSections();
    await refreshContent();
    await refreshMedia();
    await refreshPartner();
    await refreshCustomer();
    await refreshApprovals();
    renderLog();
  });

  (async function boot(){
    try{
      // resolve access (optional; serasi dengan Code.gs anda)
      try{
        const r = await gsPost('resolve_access', {});
        if(r?.user){ $('#whoami').textContent = r.user.role || 'Leader'; }
      }catch(_){}

      await loadSettings();
      await loadSections();
      await refreshMedia();
      await refreshPartner();
      await refreshCustomer();
      await refreshApprovals();
      renderLog();
      initCharts();
      lucide.createIcons();
      applyContentWidth();
    }catch(e){ console.warn(e); lucide.createIcons(); }
  })();

  </script>
</body>
</html>
