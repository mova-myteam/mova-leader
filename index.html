<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>MOVA — Log Masuk</title>

  <!-- Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root { --brand:#ef4444; }
    html,body{font-family:Inter,system-ui,ui-sans-serif;background:#fafafa}
    .container{max-width:1100px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:1rem;box-shadow:0 6px 24px rgba(15,23,42,.06)}
    .btn{display:inline-flex;align-items:center;gap:.5rem;border-radius:.75rem;padding:.65rem 1rem;font-weight:800}
    .btn-primary{background:var(--brand);color:#fff}
    .btn-ghost{background:#fff;border:1px solid #e5e7eb}
    .input{width:100%;border:1px solid #d1d5db;border-radius:.75rem;padding:.65rem .9rem;background:#fff}
    .input:focus{outline:none;box-shadow:0 0 0 2px #111}
    .muted{color:#6b7280}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#111;color:#fff;padding:.6rem .9rem;border-radius:.75rem;box-shadow:0 8px 24px rgba(0,0,0,.15);opacity:0;transition:.25s}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <div class="container mx-auto p-4">
    <div class="grid md:grid-cols-2 gap-6 items-center">
      <div>
        <h1 class="text-3xl font-extrabold tracking-tight">MOVA — Akses</h1>
        <p class="mt-2 text-gray-600">Log masuk menggunakan <strong>nama</strong> & <strong>nombor telefon</strong>. Sistem akan mengesahkan peranan anda (Leader / Partner / User).</p>
        <div class="mt-6 card p-6">
          <div class="space-y-3">
            <div>
              <label class="block text-sm font-semibold">Nama</label>
              <input id="inpName" class="input" placeholder="cth: amirul">
            </div>
            <div>
              <label class="block text-sm font-semibold">Telefon</label>
              <input id="inpPhone" class="input" placeholder="0109022333">
            </div>
            <div class="flex items-center gap-3">
              <button id="btnGo" class="btn btn-primary">Teruskan</button>
              <button id="btnClear" class="btn btn-ghost">Kosongkan</button>
            </div>
            <p class="muted text-sm">Tip: nama & telefon perlu sama seperti rekod pendaftaran anda.</p>
          </div>
        </div>
      </div>
      <div class="hidden md:block">
        <img src="https://images.unsplash.com/photo-1531297484001-80022131f5a1?q=80&w=1200&auto=format&fit=crop" class="rounded-xl shadow" alt="Laptop">
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

<script>
  // URL Web App anda (sedia ada dari rumus asal)
  const EXEC_URL = "https://script.google.com/macros/s/AKfycbylAgFpv3cyZV7jPQFF8ROBB2nEIRTdF-Go6UtHQ4YN8KfAqGa914hTtiwmVeq0XtM/exec";

  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    setTimeout(()=> el.classList.remove('show'), 2200);
  }

  function onlyDigits(s){ return String(s||'').replace(/\D+/g,''); }

  async function api(path, payload){
    const fd = new URLSearchParams();
    fd.set('path', path);
    fd.set('payload', JSON.stringify(payload||{}));
    const res = await fetch(EXEC_URL, { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:fd });
    if (!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json();
    if (json && json.success===false && json.error) throw new Error(json.error||'Ralat tidak diketahui');
    return json;
  }

  function saveSession(obj){
    try { localStorage.setItem('mova_session', JSON.stringify(obj)); } catch(_){}
  }

  function setLoading(btn, is){
    if (!btn) return;
    if (is){
      btn.disabled = true;
      btn._orig = btn.innerHTML;
      btn.innerHTML = '<span class="spinner"></span><span> Memproses...</span>';
    } else {
      btn.disabled = false;
      if (btn._orig) btn.innerHTML = btn._orig;
    }
  }

  // ===== INIT =====
  document.getElementById('year').textContent = new Date().getFullYear?.() || new Date().getFullYear?.() || '';

  document.getElementById('btnClear').addEventListener('click', ()=>{
    document.getElementById('inpName').value = '';
    document.getElementById('inpPhone').value = '';
  });

  document.getElementById('btnGo').addEventListener('click', onGo);
  document.getElementById('inpName').addEventListener('keydown', (e)=> e.key==='Enter' && onGo());
  document.getElementById('inpPhone').addEventListener('keydown', (e)=> e.key==='Enter' && onGo());

  async function onGo(){
    const btn = document.getElementById('btnGo');
    const name  = (document.getElementById('inpName').value||'').trim();
    const phone = onlyDigits(document.getElementById('inpPhone').value||'');
    if (!name || !phone) return toast('Isi nama & telefon.');

    setLoading(btn, true);
    try{
      const out = await api('resolve_access', { name, phone });
      // { success, role:'leader'|'partner'|'user'|'none', leader_id, partner_name, access:[...], message }
      const role = String(out.role||'none').toLowerCase();
      const leader_id = out.leader_id || 'LEAD-0001';
      const partner_name = out.partner_name || '';

      if (role === 'leader'){
        saveSession({
          role:'leader',
          id: leader_id,
          leader_id: leader_id,
          name, phone,
          profile:{ role:'leader', name, phone }
        });
        /* ===== TAMBAHAN PENTING (fix tendang balik) ===== */
        try {
          localStorage.setItem('mova_leader', JSON.stringify({
            leader_id,
            profile:{ role:'leader', name, phone }
          }));
        } catch(_){}
        /* ===== TAMAT TAMBAHAN ===== */
        toast('Akses leader disahkan. Membuka Dashboard…');
        return setTimeout(()=> location.href='./dashboard.html', 600);
      }

      if (role === 'partner'){
        saveSession({
          role:'partner',
          leader_id: leader_id,
          name, phone,
          partner_name,
          profile:{ role:'partner', name, phone }
        });
        toast('Akses partner disahkan. Membuka Panel Partner…');
        return setTimeout(()=> location.href='./partner.html', 600);
      }

      if (role === 'user'){
        saveSession({
          role:'user',
          leader_id: leader_id,
          partner_name,
          name, phone,
          profile:{ role:'user', name, phone }
        });
        toast('Akses user disahkan. Membuka Laman User…');
        return setTimeout(()=> location.href=`./user.html?leader=${encodeURIComponent(leader_id)}`, 600);
      }

      // role none / gagal
      toast(out.message || 'Akses tidak ditemui. Hubungi admin/partner.');
    }catch(e){
      toast(e.message || 'Ralat sambungan.');
    }finally{
      setLoading(btn, false);
    }
  }
</script>
</body>
</html>
